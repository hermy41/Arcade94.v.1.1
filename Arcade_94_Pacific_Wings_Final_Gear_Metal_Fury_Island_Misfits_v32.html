<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-visual"><meta name="theme-color" content="#0b0d16"><title>Arcade 94 · Pacific Wings · Final Gear · Metal Fury · Island Misfits</title>
<style>
@font-face{
  font-family:"Exo2-Fallback";
  src:local("Roboto Condensed"),local("Arial Narrow"),local("Roboto"),local("Arial");
  size-adjust:94%;ascent-override:94%;descent-override:24%;line-gap-override:0%;
}
@font-face{
  font-family:"Orbitron-Fallback";
  src:local("Roboto Condensed"),local("Arial Narrow"),local("Roboto"),local("Arial");
  size-adjust:96%;ascent-override:92%;descent-override:22%;line-gap-override:0%;
}
:root{
  --sat:env(safe-area-inset-top,0px);
  --sab:max(14px,env(safe-area-inset-bottom,0px));
  --sal:env(safe-area-inset-left,0px);
  --sar:env(safe-area-inset-right,0px);
  --bg:#d7d2e6;--bg2:#b4adc8;--sh:#2f2d3f;--sh2:#1a1826;--bt:#3a374a;--bt2:#201e2b;
  --st1:#7c3aed;--st2:#0284c7;--led:#ff334b;--ink:#2e2845;--emb:rgba(255,255,255,.55);
  --ltxt:#d6d1eb;--tbtn-bg:#322c4a;--tbtn-fg:#f8fafc;--hi-bg:#6d28d9;--hi-fg:#ffffff;
  --pck1:#6d28d9;--pck2:#0369a1;--pck-fg:#ffffff;--dp-ico:#cbd5e1;--sb-ring:#2b273d;
  --dpw:rgba(0,0,0,.16);--bi:none;--gl:1;--ts:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  width:100%;height:100%;height:100dvh;min-height:100svh;margin:0;padding:0;
  overflow:hidden;overscroll-behavior:none;
}
body{
  background:radial-gradient(circle at 50% 20%,#1e2235 0%,#0b0d16 75%);
  display:flex;align-items:center;justify-content:center;
  touch-action:none;user-select:none;-webkit-user-select:none;
  font:700 12px "Exo 2","Exo2-Fallback","Roboto Condensed",system-ui,sans-serif;
  font-size-adjust:from-font;
}
/* Edge-to-Edge Molded Game Boy Handheld Chassis */
#gb{
  position:relative;width:100%;height:100%;
  display:flex;flex-direction:column;overflow:hidden;
  background-color:var(--bg);
  background-image:var(--bi),linear-gradient(158deg,var(--bg) 0%,var(--bg2) 100%);
  background-position:center,center;
  background-size:var(--bsz,cover),100% 100%;
  background-repeat:var(--brep,no-repeat),no-repeat;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.32),inset 0 -4px 10px rgba(0,0,0,.22);
  transition:background-color .25s ease;
}
#gb::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
    linear-gradient(90deg,rgba(255,255,255,.15) 0%,transparent 7%,transparent 93%,rgba(0,0,0,.14) 100%),
    linear-gradient(180deg,rgba(255,255,255,.13) 0%,transparent 5%,transparent 94%,rgba(0,0,0,.16) 100%);
}
body.fs-on #gb{width:100%;height:100%;max-width:540px;border-radius:0;border:0}
@media(min-width:541px){
  #gb{
    width:min(468px,96vw);height:min(880px,96dvh);
    border-radius:18px 18px 46px 18px;
    border:1px solid rgba(255,255,255,.16);
    box-shadow:
      0 26px 70px rgba(0,0,0,.72),
      0 0 0 1px rgba(0,0,0,.55),
      inset 0 2px 2px rgba(255,255,255,.38),
      inset 0 -8px 16px rgba(0,0,0,.28);
  }
}

/* Classic DMG Top Groove Bar — 34px + Safe Top Inset, >=44px Hit Expanders, WCAG AA Pills */
#tb{
  position:relative;z-index:5;flex:none;
  min-height:calc(32px + var(--sat));
  padding:calc(3px + var(--sat)) calc(12px + var(--sar)) 3px calc(12px + var(--sal));
  contain:layout paint;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  border-bottom:1.5px solid rgba(0,0,0,.18);
  box-shadow:0 1px 0 rgba(255,255,255,.22);
}
.tgr{
  display:flex;align-items:center;gap:6px;
  font:800 8.8px/1 "Exo 2","Exo2-Fallback",sans-serif;letter-spacing:.95px;
  color:var(--ink);text-shadow:0 1px 0 var(--emb);white-space:nowrap;
}
.tgr i{
  display:inline-block;width:16px;height:6px;border-radius:3px;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.3) 0 2px,transparent 2px 5px);
}
.tbtns{display:flex;align-items:center;gap:8px}
.tbtn{
  position:relative;appearance:none;border:1px solid rgba(255,255,255,.18);cursor:pointer;
  min-height:23px;padding:4px 9px;border-radius:8px;
  background:var(--tbtn-bg);color:var(--tbtn-fg);
  font:800 8.5px/1 "Exo 2","Exo2-Fallback",sans-serif;letter-spacing:.65px;
  box-shadow:0 1px 2px rgba(0,0,0,.32);
  transition:transform .08s;touch-action:manipulation;
}
.tbtn::after{content:'';position:absolute;inset:-10px -5px}
.tbtn:active{transform:scale(.93)}
.tbtn.hi{background:var(--hi-bg);color:var(--hi-fg);border-color:rgba(0,0,0,.22)}

/* Slim Glass Screen Lens Bezel (#s) — Maximized LCD Area */
#s{
  position:relative;z-index:2;flex:1;min-height:0;
  margin:3px calc(4px + var(--sar)) 0 calc(4px + var(--sal));
  padding:12px 5px 16px 5px;
  background:linear-gradient(165deg,var(--sh) 0%,var(--sh2) 100%);
  border-radius:10px 10px 24px 10px;
  box-shadow:
    inset 0 2px 3px rgba(255,255,255,.16),
    inset 0 -3px 6px rgba(0,0,0,.55),
    0 2px 0 rgba(255,255,255,.24),
    0 5px 12px rgba(0,0,0,.34);
  display:flex;flex-direction:column;
}
#lh{
  position:absolute;left:10px;right:10px;top:2px;height:9px;
  display:flex;align-items:center;gap:5px;pointer-events:none;
}
#lh s{
  flex:1;height:4px;display:block;
  background:linear-gradient(to bottom,var(--st1) 0 1.5px,transparent 1.5px 2.5px,var(--st2) 2.5px 4px);
  border-radius:1px;opacity:.92;
}
#lh span{
  font:800 6px/1 "Exo 2","Exo2-Fallback",system-ui,sans-serif;letter-spacing:.8px;
  color:var(--ltxt);text-transform:uppercase;white-space:nowrap;
}
/* Glowing Power / Battery LED (Dark Collar Guarantees >=4.88:1 on Light/Gold Bezels) */
#led{
  position:absolute;left:10px;bottom:2px;height:12px;
  display:flex;flex-direction:row;align-items:center;gap:4px;pointer-events:none;z-index:2;
}
#led i{
  width:7px;height:7px;border-radius:50%;display:block;
  border:1.5px solid #12141c;
  background:radial-gradient(circle at 35% 35%,#fff 0%,var(--led) 52%,#2a0808 100%);
  box-shadow:0 0 6px 1px var(--led);
  animation:ledp 2.8s ease-in-out infinite;will-change:opacity;
}
#led b{
  font:800 5.5px/1 "Exo 2","Exo2-Fallback",sans-serif;letter-spacing:.5px;color:var(--ltxt);
}
@keyframes ledp{0%,100%{opacity:1}50%{opacity:.8}}

/* Recessed LCD Screen Well (#sw) */
#sw{
  position:relative;flex:1 1 0%;width:100%;min-height:0;
  display:flex;align-items:center;justify-content:center;
  background:#04060a;border-radius:4px;overflow:hidden;contain:layout paint;
  box-shadow:inset 0 3px 8px rgba(0,0,0,.92),0 1px 0 rgba(255,255,255,.12);
}
canvas{background:#000;display:block;position:relative;z-index:1;contain:paint;will-change:transform}
#sw::before{
  content:'';position:absolute;inset:0;z-index:3;pointer-events:none;
  opacity:calc(var(--gl) * .14);
  background:linear-gradient(125deg,rgba(255,255,255,.42) 0%,rgba(255,255,255,.06) 24%,transparent 40%,transparent 100%);
}
#s.mf-crt #sw::after{
  content:'';position:absolute;inset:0;z-index:4;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0px,rgba(0,0,0,0) 2px,rgba(0,0,0,.22) 2px,rgba(0,0,0,.22) 3px);
}
#s.gb-grid #sw::after{
  content:'';position:absolute;inset:0;z-index:4;pointer-events:none;
  background:
    repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.20) 2px 3px),
    repeating-linear-gradient(to right,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.14) 2px 3px);
}
canvas.mf-px{image-rendering:-moz-crisp-edges;image-rendering:crisp-edges;image-rendering:pixelated}

/* Bottom Lens Brand Plate with Contrast-Verified POCKET Badge */
#lb{
  position:absolute;left:52px;right:22px;bottom:2px;height:12px;
  display:flex;align-items:center;justify-content:center;gap:5px;pointer-events:none;
}
#lb em{
  font:italic 900 8px/1 "Orbitron","Orbitron-Fallback",sans-serif;letter-spacing:1.1px;
  color:var(--ltxt);text-shadow:0 1px 1px rgba(0,0,0,.55);
}
#lb b{
  font:800 6px/1 "Orbitron","Orbitron-Fallback",sans-serif;letter-spacing:.9px;
  padding:1.8px 5px;border-radius:3.5px;
  background:linear-gradient(135deg,var(--pck1),var(--pck2));
  color:var(--pck-fg);
}

/* Ergonomic Molded Control Deck (#pad) with Safe Bottom Reserve */
#pad{
  position:relative;z-index:2;flex:none;
  height:calc(var(--padh,31%) + var(--sab) * .45);
  min-height:calc(182px + var(--sab));max-height:320px;
  padding-bottom:var(--sab);contain:layout paint;
}

/* Sculpted Recessed 3D Cross D-Pad (Edge-Gesture Safe 18px Inset, High-Contrast Chevrons) */
#dp{
  position:absolute;left:calc(16px + var(--sal));
  top:clamp(22px,calc(100% - 178px - var(--sab)),54px);
  width:126px;height:126px;transform-origin:left center;
  transform:translate(var(--dpx,0px),var(--dpy,0px)) scale(calc(var(--dps,1) * var(--ts,1)));
}
#dp::before{
  content:'';position:absolute;inset:-6px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,var(--dpw) 58%,transparent 74%);
  border:2px solid var(--sb-ring);opacity:.72;
}
#dp i{
  position:absolute;left:0;top:0;border-radius:7px;
  background:linear-gradient(155deg,var(--bt) 0%,var(--bt2) 100%);
  box-shadow:
    0 5px 0 rgba(0,0,0,.46),
    0 7px 11px rgba(0,0,0,.24),
    inset 0 1px 1px rgba(255,255,255,.22),
    inset 0 -2px 3px rgba(0,0,0,.4);
}
#dp i:nth-of-type(1){left:42px;width:42px;height:126px}
#dp i:nth-of-type(2){top:42px;width:126px;height:42px}
#dp::after{
  content:'';position:absolute;left:43px;top:43px;width:40px;height:40px;
  border-radius:4px;pointer-events:none;
  background:
    radial-gradient(circle at 50% 50%,rgba(0,0,0,.38) 0%,rgba(0,0,0,.16) 44%,rgba(255,255,255,.07) 52%,transparent 62%),
    linear-gradient(155deg,var(--bt),var(--bt2));
}
#dp s{
  position:absolute;width:42px;height:42px;border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  text-decoration:none;font-style:normal;font-size:12px;
  color:var(--dp-ico);background:transparent;opacity:1;
  pointer-events:none;z-index:2;
}
#dp s:nth-of-type(1){left:42px;top:0}
#dp s:nth-of-type(2){left:42px;top:84px}
#dp s:nth-of-type(3){left:0;top:42px}
#dp s:nth-of-type(4){left:84px;top:42px}
#dp.u s:nth-of-type(1),#dp.d s:nth-of-type(2),#dp.l s:nth-of-type(3),#dp.r s:nth-of-type(4){
  color:#fff;background:rgba(255,255,255,.28);
}

/* Bounded Floating Analog Stick Zone (Zero Overlap With SELECT/START or Face Buttons) */
#zn{
  position:absolute;left:0;top:0;z-index:1;display:none;
  width:min(48%,calc(100% - 170px));
  height:calc(100% - 40px - var(--sab));
}
#sb,#sk{position:absolute;left:0;top:0;will-change:transform;border-radius:50%;display:none;box-sizing:border-box;pointer-events:none}
#sb{
  width:108px;height:108px;margin:-54px 0 0 -54px;
  background:radial-gradient(circle,rgba(0,0,0,.22),rgba(0,0,0,.06));
  border:3px solid var(--sb-ring);
  box-shadow:inset 0 3px 8px rgba(0,0,0,.35);
}
#sk{
  width:52px;height:52px;margin:-26px 0 0 -26px;
  background:
    radial-gradient(circle at 32% 28%,rgba(255,255,255,.28),transparent 42%),
    radial-gradient(circle,var(--bt2) 45%,var(--bt) 52%,var(--bt2) 100%);
  box-shadow:0 5px 0 rgba(0,0,0,.45),inset 0 1px 2px rgba(255,255,255,.24);
}
#sk::after{
  content:'';position:absolute;inset:-4px;border-radius:50%;
  border:3px solid #fff;background:rgba(255,255,255,.16);
  opacity:0;transition:opacity .06s;
}
#sk.on::after{opacity:1}
#sb.on{border-color:var(--hi-bg)}
.st #zn,.st #sb,.st #sk{display:block}.st #dp{display:none}

/* Molded Glossy 3D Face Action Buttons (Gloss-Resilient WCAG Ink + 54px Hit Area + GPU-Only .on) */
#ss,#fb{pointer-events:none}#ss u,#fb b{pointer-events:auto}
#fb{
  position:absolute;right:calc(15px + var(--sar));
  top:clamp(16px,calc(100% - 184px - var(--sab)),47px);
  width:138px;height:138px;transform-origin:right center;
  transform:translate(var(--fbx,0px),var(--fby,0px)) scale(calc(var(--fbs,1) * var(--ts,1)));
}
#fb::before{
  content:'';position:absolute;inset:-4px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,var(--dpw) 56%,transparent 74%);
  border:2px solid var(--sb-ring);opacity:.55;
}
#fb b{
  position:absolute;width:46px;height:46px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--bfg,#fff);font:900 14.5px/1 "Orbitron","Orbitron-Fallback",sans-serif;
  background:
    radial-gradient(circle at 28% 22%,rgba(255,255,255,.42) 0%,rgba(255,255,255,.10) 24%,transparent 38%),
    var(--bc,#c4173c);
  border:1.5px solid rgba(0,0,0,.38);
  box-shadow:
    0 5px 0 rgba(0,0,0,.44),
    0 7px 10px rgba(0,0,0,.22),
    inset 0 -3px 5px rgba(0,0,0,.30),
    inset 0 1.5px 2px rgba(255,255,255,.28);
  transition:transform .06s;will-change:transform;
}
#fb b::before{content:'';position:absolute;inset:-4px;border-radius:50%}
#fb b::after{
  content:'';position:absolute;inset:-2px;border-radius:50%;
  border:2.5px solid rgba(255,255,255,.85);background:rgba(255,255,255,.18);
  opacity:0;pointer-events:none;transition:opacity .06s;
}
#fb b.on{transform:translateY(3px) scale(.92)}
#fb b.on::after{opacity:1}

/* Rubberized Tilted SELECT / START Pills Above Android Gesture Bar */
#ss{
  position:absolute;left:0;right:0;bottom:calc(var(--sab) + 3px);z-index:3;
  display:flex;justify-content:center;gap:20px;
  transform:translateY(var(--ssy,0px));
}
#ss u{
  position:relative;text-decoration:none;color:#f8fafc;
  background:linear-gradient(180deg,var(--bt) 0%,var(--bt2) 100%);
  padding:6.5px 13.5px;border-radius:12px;
  transform:rotate(-18deg);
  font:800 8.5px/1 "Exo 2","Exo2-Fallback",sans-serif;letter-spacing:1px;
  border:1px solid rgba(0,0,0,.38);
  box-shadow:0 3px 0 rgba(0,0,0,.42),inset 0 1px 1px rgba(255,255,255,.22);
  transition:transform .07s;
}
#ss u::before{content:'';position:absolute;inset:-9px -6px;border-radius:16px}
#ss u::after{
  content:'';position:absolute;inset:-2px;border-radius:13px;
  border:2px solid rgba(255,255,255,.78);background:rgba(255,255,255,.16);
  opacity:0;pointer-events:none;transition:opacity .06s;
}
#ss u.on{transform:rotate(-18deg) translateY(2px) scale(.92)}
#ss u.on::after{opacity:1}

/* Iconic Diagonal Acoustic Speaker Grille Slots */
#spk{
  position:absolute;right:calc(12px + var(--sar));bottom:calc(var(--sab) + 2px);width:42px;height:24px;
  display:flex;gap:4px;transform:rotate(-28deg);pointer-events:none;opacity:.76;
}
#spk i{
  flex:1;height:100%;border-radius:3px;
  background:linear-gradient(90deg,rgba(0,0,0,.62),rgba(0,0,0,.28));
  box-shadow:inset 0 1px 2px rgba(0,0,0,.85),1px 0 0 rgba(255,255,255,.22);
}
.ts0{--ts:.92}.ts2{--ts:1.08}
@media(prefers-reduced-motion:reduce){
  #led i{animation:none}
  .tbtn,#fb b,#ss u,#toast{transition:none}
}
/* Live Pad Calibration Mode (Interactive Drag + Sliders Over Screen) */
.cal-on #dp,.cal-on #fb,.cal-on #ss{
  outline:1.5px dashed rgba(56,189,248,.9);outline-offset:4px;border-radius:14px;
  pointer-events:auto!important;cursor:grab;
}
.cal-on #dp{display:block!important}
.cal-on #zn{pointer-events:none!important}
.cal-on #fb b,.cal-on #ss u{pointer-events:none!important}
.cal-on #dp.cal-drag,.cal-on #fb.cal-drag,.cal-on #ss.cal-drag{
  outline-color:#fde047;background:rgba(56,189,248,.14);cursor:grabbing;
}
#cal-pop{
  position:absolute;left:8px;right:8px;top:calc(36px + var(--sat));z-index:22;contain:layout paint;
  display:none;flex-direction:column;
  background:linear-gradient(170deg,rgba(15,21,38,.96) 0%,rgba(8,12,24,.97) 100%);
  border:1.5px solid rgba(56,189,248,.65);border-radius:13px;
  padding:9px 10px 10px;color:#f1f5f9;
  box-shadow:0 14px 36px rgba(0,0,0,.8);
}
#cal-pop.open{display:flex;animation:popin .14s ease-out}
.cal-tip{
  font:700 7.5px/1.25 "Exo 2","Exo2-Fallback",sans-serif;letter-spacing:.5px;color:#fde047;
  background:rgba(253,224,71,.1);border:1px solid rgba(253,224,71,.28);
  border-radius:7px;padding:4px 7px;margin-bottom:7px;text-align:center;
}
.cal-sl{display:flex;flex-direction:column;gap:5px}
.cal-row{display:grid;grid-template-columns:84px 1fr 38px;align-items:center;gap:6px}
.cal-row label{font:800 7.5px/1 "Exo 2","Exo2-Fallback",sans-serif;letter-spacing:.6px;color:#cbd5e1}
.cal-row span{font:800 7.5px/1 "Orbitron","Orbitron-Fallback",monospace;color:#7fe8ff;text-align:right}
.cal-row input[type=range]{width:100%;height:18px;margin:0;accent-color:#38bdf8;touch-action:pan-x;cursor:pointer}
.cal-pos{font:700 7px/1.2 "Orbitron","Orbitron-Fallback",monospace;color:#94a3b8;text-align:center;margin:7px 0 6px;letter-spacing:.4px}
.cal-acts{display:grid;grid-template-columns:1fr 1.3fr;gap:6px}
.cal-btn{
  appearance:none;border:1px solid rgba(255,255,255,.18);border-radius:8px;
  padding:8px 6px;cursor:pointer;touch-action:manipulation;
  font:800 8px/1 "Orbitron","Orbitron-Fallback",sans-serif;letter-spacing:.8px;color:#e2e8f0;
  background:rgba(255,255,255,.08);
}
.cal-btn:active{transform:scale(.95)}
.cal-btn.ok{background:linear-gradient(135deg,#0284c7,#38bdf8);border-color:#bae6fd;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.45)}
.sh-pill.full{grid-column:1 / -1;border-color:rgba(253,224,71,.55);background:rgba(253,224,71,.14);color:#fde047}

/* Interactive Shell & Display Studio Drawer */
#sh-pop{
  position:absolute;inset:0;z-index:20;contain:layout paint;
  background:rgba(6,9,18,.9);
  display:none;flex-direction:column;justify-content:flex-start;
  padding:calc(10px + var(--sat)) 12px calc(10px + var(--sab));
}
#sh-pop.open{display:flex;animation:popin .16s ease-out}
@keyframes popin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
#sh-card{
  background:linear-gradient(170deg,#151a2e 0%,#0b0e1a 100%);
  border:1.5px solid rgba(125,211,252,.38);border-radius:14px;
  padding:10px 11px 12px;color:#f1f5f9;
  box-shadow:0 16px 40px rgba(0,0,0,.75);
  max-height:100%;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;
}
.tbtn,.sh-cls,.sh-sw,.sh-pill{touch-action:manipulation}
@media(max-height:640px){
  #pad{min-height:calc(168px + var(--sab))}
  #dp{top:14px}
  #fb{top:9px}
  #s{padding:11px 4px 14px 4px}
}
.sh-hdr{display:flex;align-items:center;justify-content:space-between;padding-bottom:7px;margin-bottom:8px;border-bottom:1px solid rgba(255,255,255,.14)}
.sh-hdr b{font:900 10px/1 "Orbitron","Orbitron-Fallback",sans-serif;letter-spacing:1.1px;color:#7fe8ff}
.sh-cls{appearance:none;border:0;cursor:pointer;background:rgba(255,255,255,.14);color:#fff;width:30px;height:30px;border-radius:8px;font:800 13px/1 sans-serif}
.sh-sec{font:800 8px/1 "Exo 2","Exo2-Fallback",sans-serif;letter-spacing:1px;color:#94a3b8;margin:7px 0 5px;text-transform:uppercase}
.sh-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sh-sw{
  appearance:none;border:1.5px solid rgba(255,255,255,.14);border-radius:9px;
  background:rgba(255,255,255,.06);padding:5px 4px;min-height:42px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:#e2e8f0;font:700 7.5px/1.1 "Exo 2","Exo2-Fallback",sans-serif;text-align:center;
  transition:transform .08s,border-color .12s,background .12s;
}
.sh-sw:active{transform:scale(.94)}
.sh-sw.on{border-color:#fde047;background:rgba(253,224,71,.15);color:#fde047}
.sh-chip{width:100%;height:14px;border-radius:5px;border:1px solid rgba(0,0,0,.45);display:flex;align-items:center;justify-content:flex-end;padding:0 3px;gap:2px}
.sh-chip i{width:6px;height:6px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.4)}
.sh-pills{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.sh-pill{
  appearance:none;border:1px solid rgba(255,255,255,.18);border-radius:7px;
  background:rgba(255,255,255,.07);color:#cbd5e1;min-height:34px;padding:6px 4px;cursor:pointer;
  font:800 7.6px/1.1 "Exo 2","Exo2-Fallback",sans-serif;letter-spacing:.4px;text-align:center;
}
.sh-pill.on{border-color:#38bdf8;background:rgba(56,189,248,.24);color:#fff}
.sh-row{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:6px}

/* Subtle Hardware Toast */
#toast{
  position:absolute;left:50%;top:calc(36px + var(--sat));transform:translateX(-50%) translateY(-6px);
  z-index:18;pointer-events:none;opacity:0;
  background:rgba(8,12,24,.94);color:#fde047;
  border:1px solid rgba(125,211,252,.5);border-radius:10px;
  padding:5px 12px;font:800 8px/1.2 "Orbitron","Orbitron-Fallback",sans-serif;letter-spacing:.85px;
  white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.55);
  transition:opacity .18s,transform .18s;
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

function fgSanitizeName(s){
  const clean=String(s||'').replace(/[^A-Za-z0-9 _\-]/g,'').trim().slice(0,12).toUpperCase();
  return clean||'PLAYER';
}
function fgClamp(v,lo,hi,def){const n=Number(v);return Number.isFinite(n)?M.max(lo,M.min(hi,n)):def}
function fgLoadSave(){
  const d=fgDefaultSave();
  try{
    const raw=localStorage.getItem(FG_SAVE_KEY);
    if(!raw){
      const oldNm=localStorage.getItem('fgnm');
      if(oldNm){d.name=fgSanitizeName(oldNm);d.hasNamed=true}
      const oldHi=+localStorage.getItem('fg94')||0;
      if(oldHi>0)d.highScore=oldHi;
      return d;
    }
    const p=JSON.parse(raw);
    if(!p||typeof p!='object'||p.v!==3)return d;
    d.name=fgSanitizeName(p.name);
    d.hasNamed=!!p.hasNamed;
    d.car=fgClamp(p.car|0,0,4,0);

    d.highScore=fgClamp(p.highScore|0,0,9999999,0);
    if(p.records&&typeof p.records=='object'){
      for(const k in p.records){
        const r=p.records[k];
        if(r&&typeof r=='object'&&k.length<48){
          const bl=Number(r.bestLap),bt=Number(r.bestTotal);

          }
        }
      }
    }
    if(p.set&&typeof p.set=='object'){
      const s=p.set,ds=d.set;
      ds.masterVol=fgClamp(s.masterVol,0,1,.85);
      ds.musicVol=fgClamp(s.musicVol,0,1,.75);
      ds.sfxVol=fgClamp(s.sfxVol,0,1,.85);

      ds.racingLine=s.racingLine?1:0;
      ds.cam=fgClamp(s.cam|0,0,2,0);
      ds.mirror=s.mirror===0?0:1;
    }
    return d;
  }catch(e){fgSaveOk=false;return d}
}

  const st=FG_ST[lv],nodes=st.pts,m=nodes.length,N=st.N,efx=st.edgeFx||{},cvScale=38.0;
  const edges=[];
  for(let i=0;i<m;i++){
    const x0=nodes[i][0],z0=nodes[i][1],x1=nodes[(i+1)%m][0],z1=nodes[(i+1)%m][1];
    const dx=x1-x0,dz=z1-z0,L=M.hypot(dx,dz)||1;
    edges.push([dx/L,dz/L,L]);
  }
  const fillets=[];
  for(let i=0;i<m;i++){
    const[uxIn,uzIn,LIn]=edges[(i-1+m)%m],[uxOut,uzOut,LOut]=edges[i];
    const cross=uxIn*uzOut-uzIn*uxOut,dot=M.max(-1,M.min(1,uxIn*uxOut+uzIn*uzOut));

    const sgn=dth>0?1:-1,nx=-uzIn*sgn,nz=uxIn*sgn;

    const i=off%m,nxt=(i+1)%m,pA=fillets[i].outPt,pB=fillets[nxt].inPt;
    const sLen=M.hypot(pB[0]-pA[0],pB[1]-pA[1]),yA=nodes[i][3],yB=nodes[nxt][3];
    const wA=nodes[i][4]!=null?nodes[i][4]:1,wB=nodes[nxt][4]!=null?nodes[nxt][4]:1;
    const fx=efx[i]||null;
    if(off==0){

      prims.push({type:0,p0:mid,p1:pB,len:sLen*.5,y0:ym,y1:yB,w0:wm,w1:wB,cv:0,fx,split0:1});
    }else if(sLen>1e-4){
      prims.push({type:0,p0:pA,p1:pB,len:sLen,y0:yA,y1:yB,w0:wA,w1:wB,cv:0,fx,split0:0});

      prims.push({type:1,f,len:f.arcLen,y0:nodes[nxt][3],y1:nodes[nxt][3],w0:wB,w1:wB,cv:capCv,fx:cFx});
    }
  }
  const pA0=fillets[0].outPt,pB0=fillets[1].inPt,sLen0=M.hypot(pB0[0]-pA0[0],pB0[1]-pA0[1]);
  const mid0=[(pA0[0]+pB0[0])*.5,(pA0[1]+pB0[1])*.5],ym0=(nodes[0][3]+nodes[1][3])*.5;
  const w0a=nodes[0][4]!=null?nodes[0][4]:1,w0b=nodes[1][4]!=null?nodes[1][4]:1,wm0=(w0a+w0b)*.5;
  prims.push({type:0,p0:pA0,p1:mid0,len:sLen0*.5,y0:nodes[0][3],y1:ym0,w0:w0a,w1:wm0,cv:0,fx:efx[0]||null,split0:2});

  const cum=[0];for(let i=0;i<prims.length;i++)cum.push(cum[i]+prims[i].len);
  const tot=cum[cum.length-1]||1;
  const xs=new Float32Array(N),zs=new Float32Array(N),ys=new Float32Array(N),ws=new Float32Array(N),cvs=new Float32Array(N);
  const brgs=new Uint8Array(N),tuns=new Uint8Array(N),pads=new Uint8Array(N),surfs=new Uint8Array(N),lanes=new Uint8Array(N),grips=new Float32Array(N);
  let pi=0,minX=1e9,maxX=-1e9,minZ=1e9,maxZ=-1e9;
  for(let k=0;k<N;k++){
    const d=(k/N)*tot;
    while(pi<prims.length-1&&cum[pi+1]<=d)pi++;
    const pr=prims[pi],u=M.max(0,M.min(1,(d-cum[pi])/M.max(1e-6,pr.len)));
    let sx,sz,cv=0;

      const f=pr.f,ang=f.ang0+f.dth*u;

  const smY=new Float32Array(N),smW=new Float32Array(N);

    let sy2=0,sw2=0;

    for(let o=-6;o<=6;o++)sw2+=ws[(k+o+N)%N];

  }

  let xing=null;
  if(bestX&&bestX.d<2.5){
    const y1=smY[bestX.k1],y2=smY[bestX.k2];
    xing={kUnder:y1<y2?bestX.k1:bestX.k2,kOver:y1<y2?bestX.k2:bestX.k1};
  }

  const trk=[],mini=[];
  for(let k=0;k<N;k++){
    const mx=(xs[k]-cxM)/(span*.5),my=(zs[k]-czM)/(span*.5);
    let ovp=0,brg=brgs[k],tun=tuns[k];
    if(xing){
      const dOv=M.min(M.abs(k-xing.kOver),N-M.abs(k-xing.kOver));
      const dUn=M.min(M.abs(k-xing.kUnder),N-M.abs(k-xing.kUnder));
      if(dOv<=48)brg=2;

    if(k%16==0)mini.push([mx,my]);
  }

  let inC=0;
  for(let k=0;k<N;k++){
    if(!inC&&M.abs(trk[k].cv)>=1.20){
      let ent=k;
      for(let b=1;b<36;b++){if(M.abs(trk[(k-b+N)%N].cv)<.10){ent=(k-b+N)%N;break}}
      const sgn=trk[k].cv>0?1:-1;

    }else if(inC&&M.abs(trk[k].cv)<.30)inC=0;
  }

  return FG_TRKC[lv]={trk,mini,N,xing};
}

let FGA=null;
function fgSndInit(){
  if(FGA||!AC)return FGA;
  try{
    const master=AC.createGain();master.gain.value=0;master.connect(AC.destination);
    const flt=AC.createBiquadFilter();flt.type='lowpass';flt.frequency.value=480;flt.Q.value=2.4;flt.connect(master);
    const o1=AC.createOscillator(),o2=AC.createOscillator(),sub=AC.createOscillator(),g1=AC.createGain(),g2=AC.createGain(),gs=AC.createGain();
    o1.type='sawtooth';o2.type='triangle';sub.type='sine';
    g1.gain.value=.32;g2.gain.value=.24;gs.gain.value=.46;
    o1.connect(g1);g1.connect(flt);o2.connect(g2);g2.connect(flt);sub.connect(gs);gs.connect(flt);
    const trb=AC.createOscillator(),gt=AC.createGain();trb.type='sine';gt.gain.value=0;trb.connect(gt);gt.connect(master);
    const ns=AC.createBufferSource(),nf=AC.createBiquadFilter(),ng=AC.createGain();
    ns.buffer=nbuf();ns.loop=true;nf.type='bandpass';nf.frequency.value=1420;nf.Q.value=5.2;ng.gain.value=0;
    ns.connect(nf);nf.connect(ng);ng.connect(master);
    o1.start();o2.start();sub.start();trb.start();ns.start();
    FGA={master,flt,o1,o2,sub,trb,gt,nf,ng};
  }catch(e){}
  return FGA;
}
function fgSndMute(){if(FGA&&AC)try{FGA.master.gain.setTargetAtTime(0,AC.currentTime,.04)}catch(e){}}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){fgSndMute();if(MU)setBGMVol(0);if(GM=='fg'&&fgS=='play')fgS='pause';if(GM=='mf'&&typeof MF!='undefined')MF.onBlur();if(GM=='im'&&typeof IM!='undefined')IM.onBlur();syncAudioPower()}
  else{resetFT();syncAudioPower()}
});
let _fgSndTk=0,_fgLR=-1,_fgLS=-1,_fgLT=-1,_fgLB=-1;
function fgSndUpdate(active,rpm,thr,boost,skid){
  if(!AC||!O.sn||FGS.set.mute||FGS.set.masterVol<=0||FGS.set.sfxVol<=0){fgSndMute();_fgLR=-1;return}
  if(!FGA&&active)fgSndInit();
  if(!FGA)return;
  if(!active){if(_fgLR!==0){_fgLR=0;FGA.master.gain.setTargetAtTime(0,AC.currentTime,.05)}return}
  if((++_fgSndTk%3)!==0&&thr===_fgLT&&boost===_fgLB)return;
  const qR=(rpm/50)|0,qS=(skid*20)|0;
  if(qR===_fgLR&&qS===_fgLS&&thr===_fgLT&&boost===_fgLB)return;
  _fgLR=qR;_fgLS=qS;_fgLT=thr;_fgLB=boost;
  const t=AC.currentTime,vol=FGS.set.masterVol*FGS.set.sfxVol,fBase=46+(rpm/9500)*168;
  FGA.o1.frequency.setTargetAtTime(fBase,t,.035);
  FGA.o2.frequency.setTargetAtTime(fBase*1.498,t,.035);
  FGA.sub.frequency.setTargetAtTime(fBase*.5,t,.035);
  FGA.flt.frequency.setTargetAtTime(340+(rpm/9500)*1800+(thr?480:0)+(boost?700:0),t,.045);
  FGA.trb.frequency.setTargetAtTime(1100+(rpm/9500)*2100+(boost?900:0),t,.05);
  FGA.gt.gain.setTargetAtTime(boost?.05:(thr&&rpm>5500?.018:0),t,.05);
  FGA.nf.frequency.setTargetAtTime(1250+skid*620,t,.05);
  FGA.ng.gain.setTargetAtTime(skid>.14?M.min(.09,skid*.085):0,t,.045);
  FGA.master.gain.setTargetAtTime((.058+(thr?.028:0)+(boost?.022:0))*vol,t,.045);
}

    bgPan:0,steer:0,driftInt:0,roll:0,pitch:0,shake:0,fovD:9.4,
    cam:FGS.set.cam||0,cdBump:0,wallCd:0,stuckSec:0,
    backfire:0,msg:'',mt:0,wxP,resultData:null,

  /* Pre-warm active stage caches once before countdown so Race Frame 0 has ZERO stutter */

function fgStepRace(h){
  const dt=1/60;
  if(h('t')){fgSndMute();fgPauseM=0;fgS='pause';return}
  if(h('e')){
    FG.cam=(FG.cam+1)%3;FGS.set.cam=FG.cam;fgPersist();clk();
    FG.msg=['CHASE CAM','HOOD CAM','COCKPIT CAM'][FG.cam];FG.mt=1.0;
  }
  if(FG.mt>0)FG.mt=M.max(0,FG.mt-dt);
  if(FG.shake>0)FG.shake=M.max(0,FG.shake-dt*6);
  if(FG.backfire>0)FG.backfire=M.max(0,FG.backfire-dt);
  if(FG.cdBump>0)FG.cdBump=M.max(0,FG.cdBump-dt);

  const accHeld=K.u||K.b||(FGS.set.autoAcc&&!K.d);
  const brkHeld=K.d;

  if(FG.cdSec>0){
    const prev=FG.cdSec;
    FG.cdSec=M.max(0,FG.cdSec-dt);
    FG.rpm=accHeld?M.min(8800,FG.rpm+240):M.max(1200,FG.rpm-180);
    fgSndUpdate(1,FG.rpm,accHeld?1:0,0,0);
    const stepNow=M.ceil(FG.cdSec);
    if(stepNow<FG.cdBeep&&stepNow>=1&&stepNow<=3){FG.cdBeep=stepNow;tone(520,.12,'square',.055)}
    if(prev>0&&FG.cdSec<=0){FG.cdBeep=0;tone(1040,.28,'square',.07,1320);FG.msg='GO!!';FG.mt=0.8}
    return;
  }

  FG.tmSec+=dt;FG.lapSec+=dt;
  const st=FG_ST[FG.lv],car=FGC[fgC],N=FG.N;
  const curIdx=((FG.z|0)%N+N)%N,seg=FG.trk[curIdx],wMul=seg.w||1;
  const anlg=O.ct&&M.abs(AX)>.05,rawTurn=anlg?AX:AXd?AXd:((K.r?1:0)-(K.l?1:0));
  const sens=FGS.set.steerSens;
  FG.steer+=(rawTurn-FG.steer)*((anlg||AXd)?.38:rawTurn?.16:.34);

  FG.prevGr=FG.gr;
  const spdNorm=FG.sp/FG.maxSp;
  FG.gr=M.max(1,M.min(6,1+(spdNorm*5.8|0)));
  if(FG.gr>FG.prevGr&&FG.sp>.32){FG.backfire=.18;fgSfxShift()}
  const grCap=FG.maxSp*(.30+FG.gr*.12);

  if((h('s')||h('a'))&&FG.nitros>0&&FG.ntT<=0){
    FG.nitros--;FG.ntT=FG.ntMax;FG.backfire=.3;
    FG.msg='NITRO BOOST! '+FG_NIT_S[FG.nitros];FG.mt=1.1;
    fgSfxNitro();hap([30,20,60]);
  }
  if(FG.ntT>0)FG.ntT=M.max(0,FG.ntT-dt);
  if(FG.padCd>0)FG.padCd=M.max(0,FG.padCd-dt);
  if(seg.pad&&M.abs(FG.x)<.78*wMul&&FG.padCd<=0){
    FG.padCd=.65;FG.backfire=.24;tone(780,.14,'sawtooth',.045,1180);
    FG.msg='BOOST STRIP!';FG.mt=.65;hap(14);
  }

  /* Horizon Chase-Style Smooth Dynamic FOV Pull-Back on Nitro / Boost Strip / High Speed */
  const padOn=FG.padCd>.15;
  const tgtD=FGS.set.reducedMotion?9.4:((FG.ntT>0||padOn)?7.75:9.4-spdNorm*.75+(brkHeld?.35:0));
  FG.fovD+=(tgtD-FG.fovD)*.12;

  const offRoad=M.abs(FG.x)>1.62*wMul;
  const surfGrip=st.grip*(seg.grip||1);
  const baseGrip=M.min(1.0,surfGrip+(st.wet?car.wetBonus:0));
  const effGrip=offRoad?baseGrip*.8:baseGrip;

  const nxtSlope=FG.trk[(curIdx+3)%N].y-seg.y;
  const hillMul=1+M.max(-.04,M.min(.04,-nxtSlope*.022));
  FG.hillPitch+=(M.max(-2,M.min(2,-nxtSlope*1.3))-FG.hillPitch)*.08;

  const topSp=FG.maxSp*(FG.ntT>0?1.24:1)*(padOn?1.16:1)*hillMul*(offRoad?.78:1);
  if(accHeld){
    const boostAc=(FG.ntT>0?2.1:1)*(padOn?1.45:1);
    FG.sp=M.min(topSp,FG.sp+FG.ac*boostAc*(1-(FG.sp/topSp)*.32));
    FG.pitch+=(1.8-FG.pitch)*.16;
  }else{
    FG.sp=M.max(0,FG.sp-.0024);
    FG.pitch+=(0-FG.pitch)*.14;
  }
  if(brkHeld){
    FG.sp=M.max(0,FG.sp-FG.br*(offRoad?.75:1));
    FG.pitch+=(-2.8-FG.pitch)*.2;
  }
  if(offRoad&&FG.sp>topSp)FG.sp*=.985;

  const steerAuth=(.32+.68*M.min(1,spdNorm))*sens*effGrip;
  FG.vx+=(FG.steer*car.hdMul*.04*steerAuth-FG.vx)*M.min(.5,.2*effGrip+(car.hdMul-1)*.1);
  const centForce=seg.cv*FG.sp*FG.sp*[.0052,.0066,.008][FG.dif]*car.driftSlip/effGrip;
  if(offRoad)FG.vx-=M.sign(FG.x)*.0014;
  FG.x+=FG.vx-centForce;
  if(FG.wallCd>0)FG.wallCd-=dt;
  const wallLim=2.0*wMul;
  if(M.abs(FG.x)>wallLim){
    const sg=M.sign(FG.x);FG.x=sg*(wallLim-.04);FG.vx=-sg*.006;
    if(!(FG.wallCd>0)){FG.wallCd=.45;FG.sp*=.9;FG.shake=.7;fgSfxBump()}
  }

  if(accHeld&&FG.sp<.06){
    FG.stuckSec+=dt;
    if(FG.stuckSec>1.6){FG.x*=.65;FG.sp=M.max(FG.sp,.22);FG.stuckSec=0}
  }else FG.stuckSec=0;

  const prevZ=FG.z;
  FG.z+=FG.sp;FG.totalDist+=FG.sp;
  FG.bgPan+=seg.cv*FG.sp*1.75;
  FG.roll+=(FG.steer*3.4-FG.roll)*.18;

  /* Zero-Allocation Fixed Particle Pool for Drift Smoke, Off-Road Dust & Sparks */
  const skidForce=M.abs(centForce)*24+(brkHeld&&spdNorm>.45?.65:0)+(offRoad&&spdNorm>.3?.5:0);
  FG.driftInt=M.max(0,M.min(1,skidForce-.18));
  if(FG.driftInt>.42&&!offRoad)seg.skid=1;

  const pLim=FGS.set.fxQuality?28:10;
  if(!FGS.set.reducedMotion&&(FG.driftInt>.26||offRoad)&&FG.sp>.28&&fgPtsN<pLim&&fr%(FGS.set.fxQuality?2:4)==0){
    const ci=offRoad?1:0;
    fgPtSpawn(W/2-14+(R()-.5)*3,H-22,-FG.steer*1.6+(R()-.5)*.8,.7+R(),offRoad?2.4:3.2,13,ci);
    fgPtSpawn(W/2+14+(R()-.5)*3,H-22,-FG.steer*1.6+(R()-.5)*.8,.7+R(),offRoad?2.4:3.2,13,ci);
  }
  fgPtStep();

  const grLow=FG.gr==1?0:FG.maxSp*(.30+(FG.gr-1)*.12)*.72;
  const grFrac=M.max(0,M.min(1,(FG.sp-grLow)/M.max(.08,grCap-grLow)));
  FG.rpm=M.min(9500,1500+grFrac*7400+(FG.ntT>0?700:0)|0);
  fgSndUpdate(1,FG.rpm,accHeld?1:0,FG.ntT>0?1:0,FG.driftInt);

  const newIdx=((FG.z|0)%N+N)%N;
  const sec=M.min(2,(newIdx/(N/3))|0);
  FG.secMask|=(1<<sec);
  if(prevZ%N>N*.75&&FG.z%N<N*.25&&FG.secMask==7){
    FG.secMask=1;
    FG.lastLapSec=FG.lapSec;
    if(!FG.bestLapSec||FG.lapSec<FG.bestLapSec)FG.bestLapSec=FG.lapSec;
    FG.lapSec=0;
    if(FG.lp<FG.tlp){
      FG.lp++;FG.msg=FG.lp==FG.tlp?'FINAL LAP!!':'LAP '+FG.lapLbls[FG.lp];
      FG.mt=1.6;tone(680,.18,'triangle',.055,1020);
    }else{fgFinishPlayerRace();return}
  }

  for(let i=0;i<FG.rvs.length;i++){
    const rv=FG.rvs[i];
    if(rv.cdBump>0)rv.cdBump=M.max(0,rv.cdBump-dt);
    const rIdx=((rv.z|0)%N+N)%N,rSeg=FG.trk[rIdx],rwM=rSeg.w||1;
    const lk1=FG.trk[(rIdx+12)%N],lk2=FG.trk[(rIdx+24)%N],lk3=FG.trk[(rIdx+38)%N];
    const aheadCv=M.max(M.abs(rSeg.cv),M.abs(lk1.cv),M.abs(lk2.cv),M.abs(lk3.cv));
    const cornerFactor=1-M.min(.38,aheadCv*(.16-(FG.dif*.025))/rv.skill);
    const rOff=M.abs(rv.x)>1.02*rwM;
    const distDiff=FG.totalDist-rv.totalDist;
    const mildPace=distDiff>220?1.04:distDiff<-220?0.96:1.0;
    const tgtSp=rv.maxSp*cornerFactor*(rOff?.72:1)*mildPace*(rv.finished?.65:1);
    rv.brk=rv.sp>tgtSp+.05?1:0;
    if(rv.sp<tgtSp)rv.sp=M.min(tgtSp,rv.sp+rv.ac);
    else rv.sp=M.max(tgtSp,rv.sp-.022);
    let tgtX=rv.prefLine*rwM-lk2.cv*.18;
    for(let j=0;j<FG.rvs.length;j++){
      if(i==j)continue;
      const o=FG.rvs[j],dz=o.z-rv.z;
      if(dz>0&&dz<14&&M.abs(o.x-rv.x)<.36)tgtX+=(rv.x>=o.x?.35:-.35);
    }
    const dzP=FG.z-rv.z;
    if(dzP>0&&dzP<14&&M.abs(FG.x-rv.x)<.36)tgtX+=(rv.x>=FG.x?.38:-.38);
    tgtX=M.max(-.82*rwM,M.min(.82*rwM,tgtX));
    rv.vx+=(tgtX-rv.x)*.08;rv.vx*=.82;rv.x=M.max(-1.18*rwM,M.min(1.18*rwM,rv.x+rv.vx));

    const prevRZ=rv.z;
    rv.z+=rv.sp;rv.totalDist+=rv.sp;
    const rSec=M.min(2,((((rv.z|0)%N+N)%N)/(N/3))|0);
    rv.secMask|=(1<<rSec);
    if(!rv.finished&&prevRZ%N>N*.75&&rv.z%N<N*.25&&rv.secMask==7){
      rv.secMask=1;
      if(rv.lap<FG.tlp)rv.lap++;
      else{rv.finished=true;rv.finOrder=++FG.finCount;rv.finTime=FG.tmSec}
    }

    let wrapDz=(rv.z%N)-(FG.z%N);
    if(wrapDz>N/2)wrapDz-=N;if(wrapDz<-N/2)wrapDz+=N;
    if(M.abs(wrapDz)<3.4&&M.abs(rv.x-FG.x)<.35&&FG.cdBump<=0){
      FG.cdBump=.32;rv.cdBump=.32;
      FG.sp*=.84;rv.sp*=.88;
      const push=FG.x>=rv.x?.12:-.12;
      FG.x=M.max(-1.5,M.min(1.5,FG.x+push));
      rv.x=M.max(-1.2,M.min(1.2,rv.x-push*.8));
      if(FGS.set.shake&&!FGS.set.reducedMotion)FG.shake=1.0;
      fgSfxBump();hap(28);
      if(!FGS.set.reducedMotion){
        for(let k=0;k<6;k++)fgPtSpawn(W/2+(R()-.5)*18,H-32,(R()-.5)*3.2,-1-R()*2,1.6,10,2);
      }
    }
  }

  let ahead=0;
  for(let i=0;i<FG.rvs.length;i++)if(FG.rvs[i].finished||FG.rvs[i].totalDist>FG.totalDist)ahead++;
  FG.place=1+ahead;
}

function fgFinishPlayerRace(){
  fgSndMute();fgSfxFanfare();
  const pl=FG.place,ptsEarned=FG_PTS_TABLE[pl-1]||1;
  const recKey=fgRecKey(FG.lv,fgC,FG.dif,FG.tlp,FG.mode,FGS.set.autoAcc);
  const prevRec=FGS.records[recKey]||{bestLap:0,bestTotal:0};
  let newBestLap=false,newBestTotal=false;
  if(FG.bestLapSec>0&&(!prevRec.bestLap||FG.bestLapSec<prevRec.bestLap)){prevRec.bestLap=FG.bestLapSec;newBestLap=true}
  if(FG.tmSec>0&&(!prevRec.bestTotal||FG.tmSec<prevRec.bestTotal)){prevRec.bestTotal=FG.tmSec;newBestTotal=true}
  FGS.records[recKey]=prevRec;

  let unlockedNext=false,qualified=pl<=5,champDone=false,ptsDelta=0;
  if(FG.mode==0){
    if(ptsEarned>FGS.stageBestPts[FG.lv]){
      ptsDelta=ptsEarned-FGS.stageBestPts[FG.lv];
      FGS.stageBestPts[FG.lv]=ptsEarned;
    }
    if(qualified&&FG.lv+1>=FGS.unlocked&&FG.lv<9){FGS.unlocked=FG.lv+2;unlockedNext=true}
    if(qualified&&FG.lv==9)champDone=true;
    const scoreGain=ptsEarned*500+FG.nitros*300;
    fgHI=M.max(fgHI,fgTotalPts()*1000+scoreGain);
  }
  fgPersist();
  FG.resultData={pl,ptsEarned,ptsDelta,totalPts:fgTotalPts(),newBestLap,newBestTotal,unlockedNext,qualified,champDone};
  fgResT=0;fgResSkip=0;fgM=0;
  fgS='results';ms=-1;
}

function fgFmtSec(sec){
  if(!sec||sec<=0)return'--:--.--';
  const cs=M.floor(sec*100)%100,s=M.floor(sec)%60,m=M.floor(sec/60);
  return(m<10?'0':'')+m+':'+(s<10?'0':'')+s+'.'+(cs<10?'0':'')+cs;
}

function fgDrawMinimap(mini,trk,N,pZ,rvs,cx,cy,rad,xing){
  g.strokeStyle='rgba(4,8,20,0.92)';g.lineWidth=3.6;g.lineJoin='round';g.beginPath();
  for(let i=0;i<mini.length;i++)g[i?'lineTo':'moveTo'](cx+mini[i][0]*rad,cy+mini[i][1]*rad);

  }
  const s0=mini[0];g.fillStyle='#ffffff';g.fillRect((cx+s0[0]*rad-1.5)|0,(cy+s0[1]*rad-1.5)|0,3,3);

function fgDrawMirror(st){

  g.fillStyle=st.sk[2];g.fillRect(gx,gy,gw,6);
  g.fillStyle=st.gd[1];g.fillRect(gx,gy+6,gw,8);

  fgQuad(gx+34-cvShift,gy+6,gx+40-cvShift,gy+6,gx+60,gy+14,gx+14,gy+14,st.rd2[0]);
  g.fillStyle='rgba(255,255,255,0.45)';g.fillRect((gx+36-cvShift*.5)|0,gy+8,2,5);

      const mp=5.5/(bd+5.5),cw=M.max(4,(22*mp)|0),ch=M.max(3,(13*mp)|0);
      const rx=M.max(gx+2,M.min(gx+gw-cw-2,(gx+37-(rv.x-FG.x)*28*mp-cw*.5)|0));
      const ry=M.max(gy+5,M.min(gy+gh-ch,(gy+6+mp*8-ch*.5)|0));
      const sp=fgGetCarSp(rv.c,0,rv.pIdx);
      g.drawImage(sp,0,0,sp.width,sp.height,rx,ry,cw,ch);
      if(bd<16){g.fillStyle='#fff8c0';g.fillRect(rx+1,ry+(ch>>1),2,1);g.fillRect(rx+cw-3,ry+(ch>>1),2,1)}
      shown++;
    }
  }
  g.fillStyle='rgba(255,255,255,0.14)';g.fillRect(gx+2,gy+1,18,1);
}

function fgRenderWorld(lv,zPos,camXPos,carIdx,turn,spdRatio,ntActive){
  const st=FG_ST[lv],td=fgBuildTrack(lv),N=td.N,trk=td.trk,L=fgGetLut(lv),bg3=fgGetBg3(lv);
  const inPlay=GM=='fg'&&(fgS=='play'||fgS=='pause'||fgS=='results');
  const bz=((zPos|0)%N+N)%N,frac=zPos-M.floor(zPos),night=lv==4||lv==8||lv==9;
  const shakeX=(inPlay&&FG.shake>0&&FGS.set.shake&&!FGS.set.reducedMotion)?((R()-.5)*4*FG.shake)|0:0;
  const shakeY=(inPlay&&FG.shake>0&&FGS.set.shake&&!FGS.set.reducedMotion)?((R()-.5)*3*FG.shake)|0:0;
  const hy=M.min(109,M.round(108+(inPlay?(FG.pitch||0)*.5+(FG.hillPitch||0)*.4:0)+shakeY));
  const pan=inPlay?(FG.bgPan||0):zPos*1.4;
  const prevSmooth=g.imageSmoothingEnabled;
  g.imageSmoothingEnabled=false;

  if(shakeX){g.save();g.translate(shakeX,0)}

  /* 1. 3-LAYER CRISP 1x SNES PARALLAX HORIZON (0.12x Far Sky, 0.35x Mid, 0.72x Near) */
  const ox0=-(((pan*.12)%256+256)%256)|0;
  g.drawImage(bg3.far,ox0,hy-112);if(ox0+256<W)g.drawImage(bg3.far,ox0+256,hy-112);
  if(hy>112){g.fillStyle=st.sk[0];g.fillRect(0,0,W,hy-112)}
  const ox1=-(((pan*.35)%256+256)%256)|0;
  g.drawImage(bg3.mid,ox1,hy-70);if(ox1+256<W)g.drawImage(bg3.mid,ox1+256,hy-70);
  const ox2=-(((pan*.72)%256+256)%256)|0;
  g.drawImage(bg3.near,ox2,hy-42);if(ox2+256<W)g.drawImage(bg3.near,ox2+256,hy-42);

  /* 2. ZERO-ALLOCATION PSEUDO-3D ROAD PROJECTION (Reuse Pre-Allocated FG_SEGS!) */
  const drawDist=FGS.set.fxQuality?78:56;
  const nxtSeg=trk[(bz+1)%N],baseY=trk[bz].y+(nxtSeg.y-trk[bz].y)*frac,D=inPlay?(FG.fovD||9.4):(9.4-(ntActive?1.2:spdRatio*.7));
  let cx=0,dx=0;
  for(let n=0;n<=drawDist;n++){
    const idx=(bz+n)%N,seg=trk[idx],s=FG_SEGS[n];
    const zEff=n>0?M.max(.05,n-frac):.05,p=D/(zEff+D);
    if(n>0){cx+=dx;dx+=seg.cv*.021}
    s.n=n;s.idx=idx;s.p=p;
    s.sy=hy+p*(H-hy)-(seg.y-baseY)*(1-p)*.52;
    s.y=seg.y;s.w=seg.w||1;s.rx=W*.5+cx*(1-p)*18-camXPos*p;s.rw=(10+p*210)*s.w;
    s.ob=seg.ob;s.obT=seg.obT;s.cv=seg.cv;s.tun=seg.tun;s.brg=seg.brg;s.ovp=seg.ovp;
    s.pad=seg.pad;s.surf=seg.surf;s.lanes=seg.lanes;s.sign=seg.sign;s.skid=seg.skid;s.clipY=H;
  }

  /* Solid Distant Fog Floor Fill (Zero Gradient Allocation!) */
  g.fillStyle=st.fog;g.fillRect(-16,hy,W+32,H-hy+16);

  /* Front-to-Back Road Pass with LOD Tiering & 32-Step Stage LUT */
  let maxY=H;
  const isHi=FGS.set.fxQuality,rlOn=FGS.set.racingLine&&inPlay&&fgS=='play';
  for(let k=0;k<drawDist;k++){
    const near=FG_SEGS[k],far=FG_SEGS[k+1];
    near.clipY=maxY;
    const y2=M.min(maxY,M.round(near.sy)),y1=M.max(hy,M.round(far.sy));
    if(y1>=y2)continue;
    const p=near.p,invP=1-p;
    const fi=M.min(31,M.max(0,(invP*invP*31)|0));
    const alt=(near.idx>>2)&1,alt2=(near.idx>>1)&1,altR=(near.idx>>1)&1;

    /* Opaque Alternating SNES Ground Terrain Stripe (or Gorge/Bay Under Bridges) */
    g.fillStyle=near.brg?L.brgChasm[fi]:(alt?L.gdB[fi]:L.gdA[fi]);
    g.fillRect(-16,y1,W+32,y2-y1);

    const hw1=far.rw*.5,hw2=near.rw*.5;
    const kw1=M.max(1.2,far.rw*.088),kw2=M.max(1.2,near.rw*.088);
    const sh1=far.rw*.19,sh2=near.rw*.19;
    const lx1=far.rx-hw1-sh1,lx2=near.rx-hw2-sh2,rx1=far.rx+hw1+sh1,rx2=near.rx+hw2+sh2;

    /* Shoulder / Bridge Deck */
    fgQuad(lx1,y1,rx1,y1,rx2,y2,lx2,y2,near.brg?L.brgDeck[fi]:(alt?L.shB[fi]:L.shA[fi]));

    if(k<42){
      const bw1=M.max(1.5,far.p*(near.brg?14:8)),bw2=M.max(1.5,p*(near.brg?14:8));
      const grCol=near.brg?L.brgRail[fi]:(alt?L.grB[fi]:L.grA[fi]);
      fgQuad(lx1,y1-bw1,lx1+kw1*.5,y1,lx2+kw2*.5,y2,lx2,y2-bw2,grCol);
      fgQuad(rx1-kw1*.5,y1,rx1,y1-bw1,rx2,y2-bw2,rx2-kw2*.5,y2,grCol);

      if(M.abs(near.cv)>1.0&&near.idx%6==0&&p>.12){
        const onL=near.cv>0,bx=onL?lx2:rx2,ch=bw2*2.1,cw=M.max(3,p*13);
        g.fillStyle='#080c18';g.fillRect((onL?bx-cw:bx)|0,(y2-ch)|0,cw|0,(ch*.74)|0);
        g.fillStyle=(!FGS.set.reducedMotion&&((near.idx+((fr>>2)&3))%4==0))?'#ffe038':'#ff3898';
        g.fillRect((onL?bx-cw+1:bx+1)|0,(y2-ch+1)|0,M.max(1,(cw-2)|0),M.max(1,(ch*.52)|0));
      }

      if(M.abs(near.cv)>.42||near.idx<44||near.brg){
        fgQuad(far.rx-hw1-kw1,y1,far.rx+hw1+kw1,y1,near.rx+hw2+kw2,y2,near.rx-hw2-kw2,y2,alt2?L.kb0[fi]:L.kb1[fi]);
        if(k<24){
          const bh1=kw1*.26,bh2=kw2*.26;
          fgQuad(far.rx-hw1-kw1,y1,far.rx-hw1-kw1+bh1,y1,near.rx-hw2-kw2+bh2,y2,near.rx-hw2-kw2,y2,L.kbHi[fi]);
          fgQuad(far.rx+hw1+kw1-bh1,y1,far.rx+hw1+kw1,y1,near.rx+hw2+kw2,y2,near.rx+hw2+kw2-bh2,y2,L.kbHi[fi]);
        }
      }

      fgQuad(far.rx-hw1,y1,far.rx+hw1,y1,near.rx+hw2,y2,near.rx-hw2,y2,near.tun?L.rdTun[fi]:(altR?L.rdB[fi]:L.rdA[fi]));

      if((st.wet||near.surf==1)&&isHi&&k<34){
        fgQuad(far.rx-far.rw*.16,y1,far.rx+far.rw*.16,y1,near.rx+near.rw*.16,y2,near.rx-near.rw*.16,y2,L.wet[fi]);
      }else if(near.surf==2&&k<36){
        fgQuad(far.rx-far.rw*.36,y1,far.rx+far.rw*.36,y1,near.rx+near.rw*.36,y2,near.rx-near.rw*.36,y2,'rgba(186,230,253,0.28)');
      }else if(near.surf==3&&k<36){
        fgQuad(far.rx-far.rw*.42,y1,far.rx-far.rw*.10,y1,near.rx-near.rw*.10,y2,near.rx-near.rw*.42,y2,'rgba(245,158,11,0.24)');
      }

      if(near.pad&&k<40){
        const pCol=(fr>>2&1)?'#00e8ff':'#ffe038';
        fgQuad(far.rx-far.rw*.22,y1,far.rx+far.rw*.22,y1,near.rx+near.rw*.22,y2,near.rx-near.rw*.22,y2,pCol);
      }

      if(near.ovp){
        fgQuad(far.rx-hw1,y1,far.rx+hw1,y1,near.rx+hw2,y2,near.rx-hw2,y2,'rgba(4,8,20,0.46)');
      }

      if(rlOn&&k>2&&(near.idx&3)<3){
        const rl1=-M.max(-.32,M.min(.32,far.cv*.16))*far.rw,rl2=-M.max(-.32,M.min(.32,near.cv*.16))*near.rw;
        const cvA=M.abs(near.cv),lnC=cvA>1.35?'rgba(248,56,64,0.62)':cvA>.8?'rgba(255,168,24,0.52)':'rgba(0,232,255,0.36)';
        fgQuad(far.rx+rl1-far.rw*.034,y1,far.rx+rl1+far.rw*.034,y1,near.rx+rl2+near.rw*.034,y2,near.rx+rl2-near.rw*.034,y2,lnC);
      }

      if(near.skid){
        fgQuad(far.rx-far.rw*.09,y1,far.rx-far.rw*.06,y1,near.rx-near.rw*.06,y2,near.rx-near.rw*.09,y2,'rgba(6,8,14,0.58)');
        fgQuad(far.rx+far.rw*.06,y1,far.rx+far.rw*.09,y1,near.rx+near.rw*.09,y2,near.rx+near.rw*.06,y2,'rgba(6,8,14,0.58)');
      }

      const ec=L.lnEdge[fi];
      fgQuad(far.rx-far.rw*.485,y1,far.rx-far.rw*.465,y1,near.rx-near.rw*.465,y2,near.rx-near.rw*.485,y2,ec);
      fgQuad(far.rx+far.rw*.465,y1,far.rx+far.rw*.485,y1,near.rx+near.rw*.485,y2,near.rx+near.rw*.465,y2,ec);
      if(alt2){
        if(near.lanes>=4){
          fgQuad(far.rx-far.rw*.17,y1,far.rx-far.rw*.15,y1,near.rx-near.rw*.15,y2,near.rx-near.rw*.17,y2,L.lnCtr[fi]);
          fgQuad(far.rx+far.rw*.15,y1,far.rx+far.rw*.17,y1,near.rx+near.rw*.17,y2,near.rx+near.rw*.15,y2,L.lnCtr[fi]);
          fgQuad(far.rx-far.rw*.008,y1,far.rx+far.rw*.008,y1,near.rx+near.rw*.008,y2,near.rx-near.rw*.008,y2,L.lnCtr[fi]);
        }else{
          fgQuad(far.rx-far.rw*.011,y1,far.rx+far.rw*.011,y1,near.rx+near.rw*.011,y2,near.rx-near.rw*.011,y2,L.lnCtr[fi]);
        }
      }

      if(isHi&&k<36&&(near.idx&3)==0){
        const rsz=M.max(1,(p*2.6)|0);
        g.fillStyle=L.refC;
        g.fillRect((near.rx-hw2+1)|0,y1,rsz,rsz);
        g.fillRect((near.rx+hw2-rsz-1)|0,y1,rsz,rsz);
        if(night||near.tun)g.fillRect((near.rx-rsz*.5)|0,y1,rsz,rsz);
      }
    }else{
      fgQuad(far.rx-hw1-kw1,y1,far.rx+hw1+kw1,y1,near.rx+hw2+kw2,y2,near.rx-hw2-kw2,y2,alt2?L.kb0[fi]:L.kb1[fi]);
      fgQuad(far.rx-hw1,y1,far.rx+hw1,y1,near.rx+hw2,y2,near.rx-hw2,y2,altR?L.rdB[fi]:L.rdA[fi]);
    }

    if(near.idx<4){
      const cw=near.rw/10,h=y2-y1;
      for(let c=0;c<10;c++){g.fillStyle=(c+(near.idx&1))&1?'#f8f8f8':'#080c18';g.fillRect((near.rx-hw2+c*cw)|0,y1,(cw+1)|0,h)}
    }else if(near.idx>=5&&near.idx<=10&&(near.idx&1)){
      const sOff=(near.idx&2)?.16:-.16;
      fgQuad(far.rx+far.rw*(sOff-.08),y1,far.rx+far.rw*(sOff+.08),y1,near.rx+near.rw*(sOff+.08),y2,near.rx+near.rw*(sOff-.08),y2,'rgba(248,250,252,0.52)');
    }
    maxY=y1;if(maxY<=hy)break;
  }

  /* 3. BACK-TO-FRONT PAINTERS PASS: BRIDGES, TUNNELS, GANTRIES, SOURCE-CROPPED PROPS & RIVALS */
  for(let k=drawDist-1;k>=1;k--){
    const seg=FG_SEGS[k];if(seg.sy>seg.clipY+1||seg.sy<hy)continue;
    const p=seg.p,sy=seg.sy,roadX=seg.rx,rw=seg.rw;

    if(seg.brg&&(seg.idx%6==0)&&seg.n>1){
      const gh=(34*p)|0,pw=M.max(2,(4.5*p)|0),lx=(roadX-rw*.64)|0,rx=(roadX+rw*.64-pw)|0;
      g.fillStyle=lv==6?'#c02828':'#485c7c';
      g.fillRect(lx,(sy-gh)|0,pw,gh);g.fillRect(rx,(sy-gh)|0,pw,gh);
      if(seg.idx%12==0){

  }
  else if(fgS=='name'){
    if(h('l'))fgNx=(fgNx+9)%10;if(h('r'))fgNx=(fgNx+1)%10;
    if(h('u'))fgNy=(fgNy+3)%4;if(h('d'))fgNy=(fgNy+1)%4;
    if(h('b')){fgNm=fgNm.slice(0,-1);clk()}
    else if(h('a')||h('t')){
      const ch=FG_CH[fgNy*10+fgNx];clk();
      if(ch=='<')fgNm=fgNm.slice(0,-1);
      else if(ch=='✓'||h('t')){fgNm=fgSanitizeName(fgNm);FGS.hasNamed=true;fgPersist();fgMapSel=M.min(9,FGS.unlocked-1);fgS='map'}
      else if(fgNm.length<12)fgNm+=ch;
    }
    if(h('e')){fgNm=FGS.name;fgS='title'}
  }
  else if(fgS=='car'){
    if(h('l')){fgC=(fgC+4)%5;fgPersist();clk()}
    if(h('r')){fgC=(fgC+1)%5;fgPersist();clk()}
    if(h('u')){FGS.paint[fgC]=(FGS.paint[fgC]+FG_PAINTS.length-1)%FG_PAINTS.length;fgPersist();clk()}
    if(h('d')){FGS.paint[fgC]=(FGS.paint[fgC]+1)%FG_PAINTS.length;fgPersist();clk()}
    fgSndUpdate(K.b?1:0,K.b?6600+M.sin(fr*.4)*1400:1200,K.b?1:0,0,0);
    if(h('t')||h('a')){fgSndMute();clk();fgS='map'}
    if(h('e')){fgSndMute();fgS='title'}
  }
  else if(fgS=='map'){
    if(h('l')||h('u')){fgMapSel=(fgMapSel+9)%10;clk()}
    if(h('r')||h('d')){fgMapSel=(fgMapSel+1)%10;clk()}

    }
    if(h('e')){fgS='title';clk()}
  }
  else if(fgS=='quick'){
    const d=(h('r')?1:0)-(h('l')?1:0);
    if(h('u')){fgQ.m=(fgQ.m+4)%5;clk()}if(h('d')){fgQ.m=(fgQ.m+1)%5;clk()}
    if(d){clk();

      if(fgQ.m==1){fgQ.car=(fgQ.car+d+5)%5;fgC=fgQ.car;fgPersist()}

    }
    if(go&&fgQ.m==4){clk();fgStartRace(fgQ.st,1,fgQ.dif,fgQ.lp)}
    if(h('e')){fgS='title';clk()}
  }
  else if(fgS=='opt'){
    if(fgConfirm){
      if(h('l')||h('r')){fgConfirm.sel^=1;clk()}
      if(go){

          else FGS.records={};
          fgPersist();
        }
        fgConfirm=null;
      }
      if(h('e')){fgConfirm=null;clk()}
      return;
    }
    const rows=[5,5,8,8][fgOptTab];
    if(h('u')){fgOptM=(fgOptM+rows-1)%rows;clk()}
    if(h('d')){fgOptM=(fgOptM+1)%rows;clk()}
    const d=(h('r')?1:0)-(h('l')?1:0);
    if(fgOptM==0&&(d||go)){fgOptTab=(fgOptTab+(d||1)+4)%4;clk();return}
    if(d||go){
      const v=d||1,s=FGS.set;clk();
      if(fgOptTab==0){
        if(fgOptM==1)s.masterVol=M.round(fgClamp(s.masterVol+v*.1,0,1,.85)*10)/10;
        if(fgOptM==2)s.musicVol=M.round(fgClamp(s.musicVol+v*.1,0,1,.75)*10)/10;
        if(fgOptM==3)s.sfxVol=M.round(fgClamp(s.sfxVol+v*.1,0,1,.85)*10)/10;
        if(fgOptM==4)s.mute^=1;
      }else if(fgOptTab==1){
        if(fgOptM==1)s.dif=(s.dif+v+3)%3;
        if(fgOptM==2)s.steerSens=M.round(fgClamp(s.steerSens+v*.1,.6,1.5,1)*10)/10;
        if(fgOptM==3)s.autoAcc^=1;
        if(fgOptM==4)s.unit^=1;
      }else if(fgOptTab==2){
        if(fgOptM==1){try{if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen().catch(()=>{})}catch(e){}}
        if(fgOptM==2)s.scanlines^=1;
        if(fgOptM==3)s.shake^=1;
        if(fgOptM==4)s.reducedMotion^=1;
        if(fgOptM==5)s.fxQuality^=1;
        if(fgOptM==6)s.racingLine^=1;
        if(fgOptM==7)s.mirror^=1;
      }else{
        if(fgOptM==1){O.ct^=1;ctl()}
        if(fgOptM==2)s.touchSize=(s.touchSize+v+3)%3;
        if(fgOptM==3&&!d){openPadCal();return}
        if(fgOptM==4){O.dv=(O.dv+v+DVN.length)%DVN.length;dsp()}
        if(fgOptM==5){O.sk=(O.sk+v+SKN.length)%SKN.length;skn()}
        if(fgOptM==6&&!d){fgConfirm={type:'champ',label:'RESET CHAMPIONSHIP?',sel:0};return}
        if(fgOptM==7&&!d){fgConfirm={type:'rec',label:'RESET LOCAL RECORDS?',sel:0};return}
      }
      fgApplySettings();fgPersist();
    }
    if(h('e')){fgS='title';clk()}
  }
  else if(fgS=='howto'){if(go||h('e')){fgS='title';clk()}}
  else if(fgS=='play'){fgStepRace(h)}
  else if(fgS=='pause'){
    if(h('u')){fgPauseM=(fgPauseM+2)%3;clk()}
    if(h('d')){fgPauseM=(fgPauseM+1)%3;clk()}
    if(h('e')){fgS='play';clk()}
    else if(go){clk();fgExecPause(fgPauseM)}
  }
  else if(fgS=='results'){
    fgResT++;
    if(fgResT<45&&go){fgResT=50;return}
    if(h('l')){fgM=(fgM+2)%3;clk()}
    if(h('r')){fgM=(fgM+1)%3;clk()}
    if(h('e')){fgS=FG.mode==0?'map':'title';clk()}
    else if(go){
      clk();
      if(fgM==0)fgStartRace(FG.lv,FG.mode,FG.dif,FG.tlp);
      else if(fgM==1)fgNextFromResults();
      else fgS=FG.mode==0?'map':'title';
    }
  }
  else if(fgS=='champ'){
    fgEv++;
    if(fgEv>90&&(go||h('e'))){fgS='title';clk()}
  }
}

        if (ch === '.') continue;
        const col = cmap[ch];
        if (col) { x.fillStyle = col; x.fillRect(i, j, 1, 1); }

  /* --- MULTI-FRAME METAL SLUG PIXEL EXPLOSIONS (10 FRAMES x 3 SIZE TIERS) --- */
  function getBoomFrame(sizeTier, frameIdx) {

    const total = 10, f = M.max(0, M.min(total - 1, frameIdx));

        for (let k = 0; k < 4; k++) {
          const a = k * 1.57 + f * 0.35;
          ell(x, cx + M.cos(a) * maxR * 0.72, cy + M.sin(a) * maxR * 0.6 - lift * 1.2, 2.2, 2.2, PAL.fire[1]);
        }

    }, { dither: true, selout: false });
  }

    const c = cnvGPU(1, 68), x = c._g, f = FOGC[theme] || '180,200,255';

    hz.addColorStop(0, `rgba(${f},0)`); hz.addColorStop(1, `rgba(${f},0.18)`);
    x.fillStyle = hz; x.fillRect(0, 0, 1, 68);
    return _MF_HAZE[theme] = c;
  }
  function drawAtmos(st, camX, t) {
    const gy = st.groundY, mv = SAV.set.redMotion ? 0 : t;
    g.drawImage(getHazeStrip(st.theme), 0, gy - 68, MW, 68);
    if (!SAV.set.bgDetail) return;
    if (st.theme === 'harbor' || st.theme === 'foundry' || st.theme === 'frost' || st.theme === 'desert' || st.theme === 'jungle' || st.theme === 'skyship') {

      g.save(); g.globalCompositeOperation = 'lighter';

                  : st.theme === 'frost'   ? 'rgba(186,230,253,0.07)'

                  : st.theme === 'desert'  ? 'rgba(253,224,71,0.08)'
                  : 'rgba(255,210,120,0.08)';
      for (let i = 0; i < 3; i++) {
        const sx = (((i * 124 - camX * 0.14) % 372) + 372) % 372 - 36;
        poly(g, [[sx, 0], [sx + 30, 0], [sx - 18, gy], [sx - 48, gy]], g.fillStyle);
      }
      g.restore();
    }
    if (st.theme !== 'frost' && st.theme !== 'storm' && st.theme !== 'jungle' && st.theme !== 'orbital') {
      const P = 240;
      for (let i = 0; i < 3; i++) {
        const bx = ((i * 130 - camX * 0.18) % P + P) % P - 20;
        for (let k = 0; k < 5; k++) {

  /* Near foreground (parallax 1.38x): biome-matched silhouettes, overhead cables/trusses & bottom battle rubble */
  function drawFore(st, camX, t) {
    if (!SAV.set.bgDetail) return;
    const th = st.theme, mv = SAV.set.redMotion ? 0 : t, S = 180, off = -((camX * 1.38) % S + S) % S;
    g.save();
    for (let x = off - S; x < MW + S; x += S) {

      if (th === 'frost') {

  /* Non-destructive 240p CRT scanlines via CSS overlay + optional live RGB555 pass */
  function postFx() {
    if (!ps1PostOn || !SAV.set.particles) return;
    const id = g.getImageData(0, 0, MW, MH), p = id.data;
    for (let y = 0; y < MH; y++) {
      const row = (y & 3) << 2;
      for (let x = 0; x < MW; x++) {
        const d = PS1_DITHER[row | (x & 3)];
        const k = (y * MW + x) << 2;
        let r = p[k] + d, gr = p[k + 1] + d, bl = p[k + 2] + d;
        r  = r  < 0 ? 0 : r  > 255 ? 255 : r;
        gr = gr < 0 ? 0 : gr > 255 ? 255 : gr;
        bl = bl < 0 ? 0 : bl > 255 ? 255 : bl;
        const r5 = r >> 3, g5 = gr >> 3, b5 = bl >> 3;
        p[k]     = (r5 << 3) | (r5 >> 2);
        p[k + 1] = (g5 << 3) | (g5 >> 2);
        p[k + 2] = (b5 << 3) | (b5 >> 2);
      }
    }
    g.putImageData(id, 0, 0);
  }

  /* 8-Frame Anatomical Metal Slug Running Legs + Idle / Skid / Crouch / Jump / Fall / Land */
  function getLegsSp(cid, pIdx, pose) {
    const key = `mlg2_${cid}_${pIdx}_${pose}`;
    if (SPR[key]) return SPR[key];
    const pal = OP_PAL[cid][pIdx ? 1 : 0];
    const hvy = cid === 2 ? 1 : 0;
    const shortLeg = cid === 0;
    return SPR[key] = bakeMS1(28, 12, x => {
      const px = (u, v, w, h, c) => { x.fillStyle = c; x.fillRect(u | 0, v | 0, w | 0, h | 0); };
      /* Helper: draw articulated 2-segment leg (hip -> knee -> ankle + shaped combat boot) */
      const drawLeg = (hx, hy, kx, ky, ax, ay, toeUp, front) => {
        const pCol = front ? pal.pants[2] : pal.pants[0];
        const pMid = front ? pal.pants[1] : pal.pants[0];
        const bCol = front ? pal.boot[1] : pal.boot[0];
        const bHi  = front ? pal.boot[2] : pal.boot[1];
        const thW  = 4 + hvy;
        /* Thigh (interpolated 3 steps for chunky organic curve) */
        for (let s = 0; s <= 3; s++) {
          const t = s / 3, ux = hx + (kx - hx) * t, uy = hy + (ky - hy) * t;
          px(ux - 1, uy, thW, 3, s < 2 ? pCol : pMid);
          if (front && s < 2) px(ux, uy, 2, 1, pal.pants[2]);
        }
        /* Knee pad / Rex's bare knee */
        if (shortLeg) {
          px(kx - 1, ky, 3, 2, front ? pal.skin[1] : pal.skin[0]);
        } else if (cid === 2) {
          px(kx - 1, ky, 4, 3, front ? pal.shirt[2] : pal.shirt[0]);
        } else if (cid === 1 && front) {
          px(kx - 1, ky - 1, 4, 1, pal.band[1]); /* Nova thigh strap */
        }
        /* Shin (knee -> ankle) */
        for (let s = 0; s <= 2; s++) {
          const t = s / 2, ux = kx + (ax - kx) * t, uy = ky + (ay - ky) * t;
          px(ux - 1, uy, 3 + hvy, 3, shortLeg ? (front ? pal.skin[1] : pal.skin[0]) : pMid);
        }
        /* Sculpted Combat Boot with sole & toe highlight */
        const bw = 5 + hvy, by = ay + 1;
        px(ax - 1, by, bw, 3, bCol);
        px(ax, by, bw - 2, 1, bHi);
        if (toeUp > 0) { px(ax + bw - 2, by - 1, 2, 2, bHi); }
        else if (toeUp < 0) { px(ax - 2, by + 1, 2, 2, bCol); }
        /* Dark rubber sole tread */
        px(ax - 1, by + 2, bw + (toeUp > 0 ? 1 : 0), 1, '#241201');
      };

      /* Pose table: [backKneeX, backKneeY, backAnkX, backAnkY, backToe, frontKneeX, frontKneeY, frontAnkX, frontAnkY, frontToe, hipY] */
      const P = {
        id: [11, 5, 10, 8,  0,  16, 5, 17, 8,  0, 1],
        ld: [10, 6,  9, 8,  0,  17, 6, 18, 8,  0, 2],
        sk: [15, 6, 18, 8,  1,  19, 5, 22, 8,  1, 2],
        cr: [ 9, 7,  7, 8, -1,  17, 6, 17, 8,  0, 3],
        jp: [ 9, 5,  7, 8, -1,  18, 3, 19, 6,  1, 1],
        fl: [11, 6, 10, 9, -1,  16, 5, 17, 8, -1, 1],
        /* 8-frame full anatomical Metal Slug sprint cycle (r0..r3 Right lead, r4..r7 Left lead) */
        r0: [ 9, 5,  5, 8, -1,  18, 5, 21, 8,  1, 1], /* R Contact */
        r1: [ 8, 6,  5, 7, -1,  17, 6, 19, 8,  0, 2], /* R Down / Squash */
        r2: [14, 4, 11, 7,  0,  14, 6, 14, 8,  0, 1], /* R Passing */
        r3: [19, 4, 18, 7,  1,  10, 5,  7, 8, -1, 0], /* R High Drive */
        r4: [18, 5, 21, 8,  1,   9, 5,  5, 8, -1, 1], /* L Contact (depth swap!) */
        r5: [17, 6, 19, 8,  0,   8, 6,  5, 7, -1, 2], /* L Down / Squash */
        r6: [14, 6, 14, 8,  0,  14, 4, 11, 7,  0, 1], /* L Passing */
        r7: [10, 5,  7, 8, -1,  19, 4, 18, 7,  1, 0]  /* L High Drive */
      }[pose] || [11, 5, 10, 8, 0, 16, 5, 17, 8, 0, 1];

      const hy = P[10];
      /* Draw Far Leg first, then Hip/Pelvis Belt, then Near Leg */
      drawLeg(13, hy + 1, P[0], P[1], P[2], P[3], P[4], false);
      /* Pelvis shorts/trousers + Tactical utility belt with brass buckle & pouches */
      px(10 - hvy, hy, 9 + hvy * 2, 4, pal.pants[1]);
      px(11, hy, 6, 2, pal.pants[2]);
      px(10 - hvy, hy, 9 + hvy * 2, 2, '#3a2414');
      px(14, hy, 2, 2, pal.acc); /* Brass belt buckle */
      px(10, hy, 2, 2, pal.pack[1]); /* Side ammo pouch */
      drawLeg(14, hy + 1, P[5], P[6], P[7], P[8], P[9], true);

  /* Composite Operative Sprite for Arcade 94 Hub, Character Select, Title Squad & HUD Portrait */
  function getCharSp(cid, pIdx, pose) {
    const key = `mch2_${cid}_${pIdx}_${pose}`;
    if (SPR[key]) return SPR[key];
    const c = cnv(34, 34), x = c.getContext('2d');
    x.imageSmoothingEnabled = false;
    const isRun = pose && pose[0] === 'r';

  /* Split-Body Metal Slug Operative Renderer (8-Frame Fluid Run, Lean, Landing Squash & Dynamic Weapons) */
  function drawOperativeSplit(w, p, cx) {
    const px = (p.x - cx) | 0, py = p.y | 0;
    const footY = py + p.h;
    const speedAbs = M.abs(p.vx);
    const running = !p.crouch && p.onG && speedAbs > 10 && !(p.skidT > 0);
    const step8 = (p.anim | 0) & 7;

    /* Grounded dynamic drop shadow (stretches slightly on stride) */
    if (p.onG) {
      const shW = running && (step8 === 0 || step8 === 4) ? p.w + 7 : p.w + 4;
      g.fillStyle = 'rgba(36,18,1,0.46)';
      g.fillRect((px + (p.w - shW) / 2) | 0, footY - 1, shW, 3);
    }

    const aimIdx = p.aimY < 0 ? (p.aimX !== 0 ? 1 : 2) : p.aimY > 0 ? (p.aimX !== 0 ? 3 : 4) : 0;
    const legPose = p.crouch ? 'cr'
                  : !p.onG ? (p.vy < 15 ? 'jp' : 'fl')
                  : p.skidT > 0 ? 'sk'
                  : p.landT > 0 ? 'ld'
                  : running ? ('r' + step8) : 'id';

    /* Natural 8-frame vertical stride arc + landing compression + idle breathing */
    const bobY = running ? [0, 1, 0, -1, 0, 1, 0, -1][step8]
               : (p.landT > 0 ? 1 : (!p.crouch && p.onG && ((fr >> 4) & 1) ? 1 : 0));
    const lean = running && speedAbs > 42 ? 1 : 0;
    const flow = running ? (step8 >> 1) : (!p.onG ? ((fr >> 2) & 3) : ((fr >> 4) & 3));
    const recoil = p.muzT > 0 ? 1 : 0;
    const recoilX = recoil ? -2 : 0;

    const lg = getLegsSp(w.ch.id, SAV.palIdx[w.ch.id], legPose);
    const tr = getTorsoSp(w.ch.id, SAV.palIdx[w.ch.id], aimIdx, p.crouch, flow, lean);
    const wp = getWeaponSp(p.wpn, aimIdx, recoil);
    const hitF = p.hurtT > 0;
    const torsoTop = footY - (p.crouch ? 27 : 31) + bobY;

    g.save();
    if (p.dir < 0) { g.translate((px + p.w) | 0, 0); g.scale(-1, 1); }
    const bx = p.dir < 0 ? -9 : px - 9;
    drPS1(hitF ? lg.hit : lg, bx, footY - 13);
    drPS1(hitF ? tr.hit : tr, bx - 2 + recoilX, torsoTop);
    const wpOff = [[9, 4], [9, 1], [5, -4], [9, 7], [5, 8]][aimIdx] || [9, 4];
    drPS1(hitF ? wp.hit : wp, bx + wpOff[0] + lean, torsoTop + wpOff[1] + (p.crouch ? 3 : 0));

    /* Giant Spiky Golden-White Metal Slug Muzzle Flare */
    if (p.muzT > 0) {
      const msp = getMuzzleSp();
      const mOff = p.crouch ? [28, 12] : [[28, 9], [25, 0], [12, -10], [24, 16], [14, 19]][aimIdx];
      g.save();
      g.globalCompositeOperation = 'lighter';
      drPS1(msp, bx + mOff[0] + lean, torsoTop + mOff[1]);
      g.restore();
      drPS1(msp, bx + mOff[0] + lean, torsoTop + mOff[1]);
    }
    g.restore();
  }

  /* --- 8 HAND-CRAFTED METAL SLUG ENEMIES (ROUND OLIVE HELMETS, BIG NOSES, NAZCA MECHS) --- */

  /* --- CURVED 3/4 SV-001 STYLE MFX-7 BULLDOG TANK WITH LIVING SUSPENSION --- */
  function getBulldogParts(treadFrm) {
    const key = `bd_${treadFrm}`;
    if (SPR[key]) return SPR[key];
    const treads = bakeMS1(52, 16, x => {
      ell(x, 26, 9, 23, 6, PAL.steel[0]);
      ell(x, 26, 9, 21, 5, PAL.steel[1]);
      for (let i = 0; i < 6; i++) {
        const wx = 9 + i * 6.8 + (treadFrm & 1);
        ell(x, wx, 9, 3, 3, PAL.steel[3]);
        ell(x, wx, 9, 1.4, 1.4, PAL.steel[0]);
      }
      x.fillStyle = PAL.steel[4];
      for (let i = treadFrm % 4; i < 42; i += 4) { x.fillRect(5 + i, 3, 2, 1); x.fillRect(5 + i, 14, 2, 1); }
    }, { dither: false });
    const hull = bakeMS1(52, 26, x => {
      ell(x, 25, 16, 21, 8, PAL.olive[2]);
      ell(x, 24, 14, 18, 6, PAL.olive[3]);
      ell(x, 22, 12, 11, 3, PAL.olive[4]);
      x.fillStyle = PAL.olive[1]; x.fillRect(6, 17, 38, 5);
      x.fillStyle = PAL.gold[3];  x.fillRect(8, 19, 24, 2);
      for (let i = 0; i < 4; i++) { x.fillStyle = PAL.olive[0]; x.fillRect(10 + i * 6, 19, 3, 2); }
      x.fillStyle = PAL.rust[2];  x.fillRect(12, 16, 4, 2); x.fillRect(30, 17, 5, 2);
      ell(x, 24, 9, 12, 7, PAL.olive[3]);
      ell(x, 22, 7, 8, 4, PAL.olive[4]);
      x.fillStyle = '#38bdf8'; x.fillRect(28, 7, 5, 3); x.fillStyle = '#ffffff'; x.fillRect(29, 7, 2, 1);
      x.fillStyle = PAL.steel[2]; x.fillRect(16, 1, 9, 3);
      x.fillStyle = PAL.rust[1]; x.fillRect(4, 10, 4, 7);
      x.fillStyle = PAL.steel[1]; x.fillRect(34, 8, 15, 5);
      x.fillStyle = PAL.steel[4]; x.fillRect(35, 8, 13, 2);
      x.fillStyle = PAL.steel[0]; x.fillRect(47, 7, 3, 7);
    }, { dither: true, grime: 4 });
    return SPR[key] = { treads, hull };
  }

  function drawBulldogLive(w, v, p, cx) {
    const vx = (v.x - cx) | 0, vy = v.y | 0;
    const { treads, hull } = getBulldogParts((v.anim | 0) & 3);
    const recoilX = (p.inVeh && p.muzT > 0) ? -2 : 0;
    const bounceY = v.onG ? ((M.abs(v.vx) > 4 && ((v.anim | 0) & 1)) ? -1 : 0) : -2;
    g.fillStyle = 'rgba(10,12,20,0.52)';
    g.fillRect(vx - 6, vy + v.h - 1, v.w + 12, 4);
    g.save();
    if (v.dir < 0) { g.translate((vx + v.w) | 0, 0); g.scale(-1, 1); }
    const ox = v.dir < 0 ? -10 : vx - 10;
    drPS1(treads, ox, vy + 7);
    drPS1(hull, ox + recoilX, vy - 13 + bounceY);
    if (p.inVeh && (fr % 14 === 0)) spawnPart(v.x + (v.dir > 0 ? 4 : 30), v.y - 2, -v.dir * 18, -22, '#64748b', 3, 0.35, -15);
    g.restore();
  }

  /* Dither transparent pixel-art layers cleanly (binary alpha, PS1 4x4 RGB555 on opaque pixels) */
  function ditherLayerPS1(c) {
    const a = c.width, b = c.height, sx = getScratch(a, b);
    sx.imageSmoothingEnabled = false; sx.drawImage(c, 0, 0);
    const id = sx.getImageData(0, 0, a, b), p = id.data;
    for (let j = 0; j < b; j++) {
      for (let i = 0; i < a; i++) {
        const k = (j * a + i) << 2;
        if (p[k + 3] > 110) {
          p[k] = ps1Ch(p[k], i, j, true); p[k + 1] = ps1Ch(p[k + 1], i, j, true); p[k + 2] = ps1Ch(p[k + 2], i, j, true); p[k + 3] = 255;
        } else { p[k + 3] = 0; }
      }
    }
    const out = cnvGPU(a, b); out._g.putImageData(id, 0, 0);
    return out;
  }

    p.hp = ch.hp; p.invT = 1.6; p.skillT = 0; p.skillCd = 0; p.shieldHp = 0; p.fireCd = 0;

      w.barrels.forEach((b, i) => { b.dead = snap.deadBarrels[i] || 0; b.hp = 16; });

      w.camX = M.max(0, M.min(w.st.w - MW, p.x - 100));
