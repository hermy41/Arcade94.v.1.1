      x.fillStyle = '#cbd5e1'; x.fillRect(rm.minecart.x0 * TILE, ry + 4, (rm.minecart.x1 - rm.minecart.x0 + 1) * TILE, 2);
      x.fillRect(rm.minecart.x0 * TILE, ry + 10, (rm.minecart.x1 - rm.minecart.x0 + 1) * TILE, 2);
    }
    x.restore();
  }

  /* --- START STAGE & ROOM RUNTIME INITIALIZATION --- */
  function startStage(stId) {
    /* Release previous stage's enemy/boss sprites to keep iOS Safari canvas memory minimal */
    for (const k in SPR) {
      if (k.startsWith('hd_e_') || k.startsWith('hd_bs_')) {
        releaseCanvas(SPR[k].hit); releaseCanvas(SPR[k]); delete SPR[k];
      }
    }
    const rooms = buildStageRooms(stId);
    const rStates = rooms.map(rm => ({
      unlocked: !rm.lock,
      bridges: [],
      planks: [],
      dug: {},
      cracked: {},
      litBraz: {},
      collected: {},
      cleared: false,
      visited: false,
      blocks: rm.blocks.map(b => ({ c: b.c, r: b.r, ic: b.ic, ir: b.ir, x: b.c * TILE, y: b.r * TILE, vx: 0, vy: 0, sliding: 0 })),
      undoBlocks: null
    }));
    const mkMisfit = (hid, x, y) => ({
      hid, x, y, w: 12, h: 12, dir: 0, anim: 0,
      tool: 'none', carry: null, handsUp: 0, hurtT: 0, invT: 0,
      stunT: 0, hook: null, bellT: 0, hopT: 0, sqT: 0
    });
    WLD = {
      stId, st: STAGES[stId], rooms, rStates, rmIdx: 0,
      leadIdx: 0,
      duo: [mkMisfit(SAV.lead, 3 * TILE + 2, 6 * TILE + 2), mkMisfit(SAV.partner, 2 * TILE + 2, 6 * TILE + 2)],
      trail: [],
      partnerHold: 0, gateLatchT: 0,
      hp: 6, maxHp: 6, starGauge: 0, lives: 3, score: 0, time: 0,
      pineGot: 0, msg: '', msgT: 0,
      props: [], items: [], enemies: [], boss: null,
      gateOpen: 0, cart: null, winT: 0, overT: 0
    };
    enterRoom(0, 3 * TILE + 2, 6 * TILE + 2, 0, 0);
    WLD.msg = 'STAGE ' + (stId + 1) + ': ' + STAGES[stId].name; WLD.msgT = 2.4;
    state = 'play'; ms = -1; applyVol(); resetFT();
  }

  function enterRoom(idx, sx, sy, panDx, panDy) {
    if (panDx || panDy) {
      _panOldC._g.drawImage(_roomBgC, 0, 0);
      _panT = 20; _panDx = panDx; _panDy = panDy;
    }
    WLD.rmIdx = idx;
    const rm = WLD.rooms[idx], rs = WLD.rStates[idx];
    rs.visited = true;
    P_PROJ.clear(); P_PART.clear(); P_POP.clear();
    WLD.trail.length = 0;
    WLD.partnerHold = 0; WLD.gateLatchT = 0;
    const L = WLD.duo[WLD.leadIdx], P = WLD.duo[WLD.leadIdx ^ 1];
    L.x = sx; L.y = sy; L.hook = null;
    P.x = M.max(TILE + 2, M.min(IW - TILE * 2, sx - panDx * 14));
    P.y = M.max(TILE + 2, M.min(PLAY_H - TILE * 2, sy - panDy * 14));
    P.hook = null;
    if (rm.boss >= 0) { L.tool = 'none'; P.tool = 'none'; L.carry = null; P.carry = null; }

    WLD.props = rm.props.map((p, i) => ({ id: i, x: p.c * TILE + 1, y: p.r * TILE + 1, k: p.k, alive: 1 }));
    WLD.items = [];
    rm.items.forEach((it, i) => {
      if (!rs.collected[i]) WLD.items.push({ idx: i, x: it.c * TILE + 1, y: it.r * TILE + 1, k: it.k, alive: 1 });
    });
    WLD.enemies = rs.cleared ? [] : rm.enemies.map(e => ({
      x: e.c * TILE, y: e.r * TILE, t: e.t,
      hp: e.t === 'tiki' || e.t === 'elite' || e.t === 'bosun' ? 2 : 1,
      dir: 2, vx: 0, vy: 0, tmr: 0.6 + R() * 0.9, stunT: 0, hurtT: 0,
      awake: e.t !== 'tiki', alive: 1, anim: 0
    }));
    WLD.boss = null;
    if (rm.boss >= 0) {
      const bHp = [6, 7, 8, 8, 10][rm.boss];
      WLD.boss = {
        id: rm.boss, hp: bHp, maxHp: bHp, ph: 1,
        x: 9 * TILE, y: 3 * TILE, vx: 44, vy: 0, tmr: 1.1, st: 'move',
        hurtT: 0, invT: 0, stunT: 0, alive: 1, anim: 0,
        sub: rm.boss === 2 || rm.boss === 3 ? { x: 14 * TILE, y: 4 * TILE, hp: bHp >> 1, maxHp: bHp >> 1, vx: -42, vy: 28, tmr: 1.4, hurtT: 0, alive: 1 } : null
      };
      WLD.msg = 'BOSS: ' + WLD.st.bossName + '!'; WLD.msgT = 2.2;
      ms = -1;
    }
    WLD.cart = rm.minecart ? { x: rm.minecart.x0 * TILE, y: rm.minecart.y * TILE, riding: 0, dir: 1, x0: rm.minecart.x0 * TILE, x1: rm.minecart.x1 * TILE } : null;
    for (const b of rs.blocks) { b.x = b.c * TILE; b.y = b.r * TILE; b.vx = 0; b.vy = 0; b.sliding = 0; }
    bakeRoomBg(rm, WLD.st, rs);
    if (panDx || panDy) _panNewC._g.drawImage(_roomBgC, 0, 0);
  }

  /* --- TILE & COLLISION QUERIES --- */
  function hasBridge(rs, c, r) {
    for (const br of rs.bridges) {
      if (br.r0 === br.r1 && r === br.r0 && c >= M.min(br.c0, br.c1) && c <= M.max(br.c0, br.c1)) return 1;
      if (br.c0 === br.c1 && c === br.c0 && r >= M.min(br.r0, br.r1) && r <= M.max(br.r0, br.r1)) return 1;
    }
    for (const pl of rs.planks) if (pl.c === c && pl.r === r) return 1;
    return 0;
  }
  function isDoorBlocked(rm, rs, c, r) {
    if (!rm.lock || rs.unlocked) return 0;
    const d = rm.lock.dir;
    if (d === 'N' && r === 0 && (c === 9 || c === 10)) return 1;
    if (d === 'S' && r === 12 && (c === 9 || c === 10)) return 1;
    if (d === 'W' && c === 0 && r === 6) return 1;
    if (d === 'E' && c === 19 && r === 6) return 1;
    return 0;
  }
  function projSolid(c, r) {
    if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return 1;
    const rm = WLD.rooms[WLD.rmIdx], rs = WLD.rStates[WLD.rmIdx], ch = rm.grid[r][c];
    if (ch === '#' || ch === 'P') return 1;
    if (ch === 'C' && !rs.cracked[c + ',' + r]) return 1;
    if (ch === 'G' && !WLD.gateOpen) return 1;
    if (isDoorBlocked(rm, rs, c, r)) return 1;
    return 0;
  }
  function tileSolid(c, r, forBlock, isPip) {
    if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return 1;
    const rm = WLD.rooms[WLD.rmIdx], rs = WLD.rStates[WLD.rmIdx];
    const ch = rm.grid[r][c];
    if (ch === '#' || ch === 'P' || ch === 'H') return 1;
    if (ch === 'C' && !rs.cracked[c + ',' + r]) return 1;
    if (ch === 'G' && !WLD.gateOpen) return 1;
    if (isDoorBlocked(rm, rs, c, r)) return 1;
    if (ch === '~') {
      if (forBlock) return 1;
      if (hasBridge(rs, c, r)) return 0;
      if (WLD.cart && WLD.cart.riding) return 0;
      return 1;
    }
    if (ch === 'B') return 1;
    return 0;
  }
  function blockAt(c, r, skipB) {
    const blks = WLD.rStates[WLD.rmIdx].blocks;
    for (let i = 0; i < blks.length; i++) {
      const b = blks[i];
      if (b !== skipB && !b.sliding && b.c === c && b.r === r) return b;
    }
    return null;
  }
  function rectBlocked(x, y, w, h, isPip) {
    const c0 = (x / TILE) | 0, c1 = ((x + w - 0.1) / TILE) | 0;
    const r0 = (y / TILE) | 0, r1 = ((y + h - 0.1) / TILE) | 0;
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
      if (tileSolid(c, r, 0, isPip)) return 1;
      if (blockAt(c, r, null)) return 1;
    }
    return 0;
  }

  /* --- DAMAGE & HEALING --- */
  function hurtPlayer(pips = 2) {
    const L = WLD.duo[WLD.leadIdx];
    if (L.invT > 0 || WLD.overT > 0 || WLD.winT > 0) return;
    WLD.hp = M.max(0, WLD.hp - pips);
    L.invT = 1.25; L.hurtT = 0.22; L.sqT = 0.34;
    _shakeT = 0.22; _shakeMag = 3;
    sfxHurt(); hap(30);
    burstParts(L.x + 6, L.y + 6, '#f43f5e', 8);
    if (WLD.hp <= 0) {
      WLD.lives--;
      if (WLD.lives > 0) {
        WLD.hp = WLD.maxHp;
        WLD.msg = 'OOPS! LIVES LEFT: ' + WLD.lives; WLD.msgT = 1.6;
        L.invT = 2.0;
      } else {
        WLD.overT = 2.6;
        WLD.msg = 'WASHED OUT!'; WLD.msgT = 2.6;
      }
    }
  }
  function healPlayer(pips, x, y) {
    if (WLD.hp >= WLD.maxHp) {
      WLD.starGauge += pips;
      spawnPop(x, y, '+' + pips + ' STAR', 1);
      if (WLD.starGauge >= 6) {
        WLD.starGauge -= 6; WLD.lives = M.min(9, WLD.lives + 1);
        spawnPop(x, y - 10, '1-UP!!', 3); sfxDoor();
      }
    } else {
      WLD.hp = M.min(WLD.maxHp, WLD.hp + pips);
      spawnPop(x, y, '+' + pips + ' HP', 3);
    }
  }

  /* --- SLIDING BLOCK KICK, CURRENT REDIRECTION & STAR SWITCH CHECK --- */
  const DIRS = [[0,1],[0,-1],[-1,0],[1,0]];
  function kickBlock(b, dir) {
    const rs = WLD.rStates[WLD.rmIdx];
    const [dc, dr] = DIRS[dir];
    const nc = b.c + dc, nr = b.r + dr;
    if (tileSolid(nc, nr, 1, 0) || blockAt(nc, nr, b)) { sfxClack(); return 0; }
    rs.undoBlocks = rs.blocks.map(o => ({ c: o.c, r: o.r }));
    b.vx = dc * 168; b.vy = dr * 168; b.sliding = 1;
    WLD.duo[WLD.leadIdx].sqT = 0.34;
    sfxKick(); hap(8);
    burstParts(b.x + 8, b.y + 8, '#fde047', 5);
    return 1;
  }
  function undoKick() {
    const rs = WLD.rStates[WLD.rmIdx];
    if (!rs.undoBlocks) return;
    for (let i = 0; i < rs.blocks.length; i++) {
      const b = rs.blocks[i], u = rs.undoBlocks[i];
      b.c = u.c; b.r = u.r; b.x = u.c * TILE; b.y = u.r * TILE; b.vx = 0; b.vy = 0; b.sliding = 0;
    }
    rs.undoBlocks = null;
    sfxReset(); WLD.msg = 'KICK UNDONE'; WLD.msgT = 1.0;
  }
  function resetRoomBlocks() {
    const rs = WLD.rStates[WLD.rmIdx];
    for (const b of rs.blocks) { b.c = b.ic; b.r = b.ir; b.x = b.ic * TILE; b.y = b.ir * TILE; b.vx = 0; b.vy = 0; b.sliding = 0; }
    rs.undoBlocks = null;
    sfxReset(); WLD.msg = 'ROOM BLOCKS RESET'; WLD.msgT = 1.1;
  }
  function checkRoomUnlock() {
    const rm = WLD.rooms[WLD.rmIdx], rs = WLD.rStates[WLD.rmIdx];
    if (!rm.lock || rs.unlocked) return;
    if (rm.lock.type === 'star') {
      let total = 0, covered = 0;
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
        if (rm.grid[r][c] === 'S') { total++; if (blockAt(c, r, null)) covered++; }
      }
      if (total > 0 && covered === total) {
        rs.unlocked = true; WLD.score += 500;
        sfxDoor(); _shakeT = 0.25; _shakeMag = 2;
        WLD.msg = 'PUZZLE SOLVED! GATE OPEN!'; WLD.msgT = 1.8;
      }
    } else if (rm.lock.type === 'enemies') {
      let alive = 0;
      for (let i = 0; i < WLD.enemies.length; i++) if (WLD.enemies[i].alive) alive++;
      if (alive === 0) {
        rs.unlocked = true; rs.cleared = true; WLD.score += 300;
        sfxDoor(); WLD.msg = 'AREA CLEAR! GATE OPEN!'; WLD.msgT = 1.6;
      }
    }
  }

  /* --- THROWABLE / EXPLOSIVE SPAWN & BLAST --- */
  function spawnProj(x, y, vx, vy, kind, fromEn, dmg, catchable = 1) {
    const pr = P_PROJ.alloc(); if (!pr) return;
    pr.x = x; pr.y = y; pr.vx = vx; pr.vy = vy;
    pr.z = 8; pr.vz = 58; pr.kind = kind; pr.fromEn = fromEn;
    pr.dmg = dmg; pr.catchable = catchable; pr.t = 0;
    pr.maxT = kind === 'bomb' ? 1.05 : 0.85; pr.alive = 1;
    pr.bounces = kind === 'bone_b' ? 2 : 0;
  }
  function bombExplode(x, y) {
    sfxBoom(); _shakeT = 0.28; _shakeMag = 3.5; hap(25);
    burstParts(x, y, '#f97316', 14);
    const rm = WLD.rooms[WLD.rmIdx], rs = WLD.rStates[WLD.rmIdx];
    const cc = (x / TILE) | 0, cr = (y / TILE) | 0;
    for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) {
      const tc = cc + dc, tr = cr + dr;
      if (tr >= 0 && tr < ROWS && tc >= 0 && tc < COLS && rm.grid[tr][tc] === 'C' && !rs.cracked[tc + ',' + tr]) {
        rs.cracked[tc + ',' + tr] = 1; WLD.score += 200;
        burstParts(tc * TILE + 8, tr * TILE + 8, '#d6d3d1', 10);
        spawnPop(tc * TILE + 8, tr * TILE, 'SECRET!', 1);
      }
    }
    for (const e of WLD.enemies) if (e.alive && M.hypot(e.x + 8 - x, e.y + 8 - y) < 34) hitEnemy(e, 3);
    if (WLD.boss && WLD.boss.alive) {
      if (M.hypot(WLD.boss.x + 14 - x, WLD.boss.y + 14 - y) < 38) hitBoss(WLD.boss, 2);
      if (WLD.boss.sub && WLD.boss.sub.alive && M.hypot(WLD.boss.sub.x + 14 - x, WLD.boss.sub.y + 14 - y) < 38) hitBossSub(WLD.boss.sub, 2);
    }
  }

  function hitEnemy(e, dmg) {
    e.hp -= dmg; e.hurtT = 0.16; e.awake = 1;
    burstParts(e.x + 8, e.y + 8, '#fde047', 6);
    if (e.hp <= 0) {
      e.alive = 0; WLD.score += 150; sfxSmash();
      spawnPop(e.x + 8, e.y, '+150', 1);
      if (R() < 0.35) WLD.items.push({ idx: -1, x: e.x + 1, y: e.y + 1, k: R() < 0.7 ? 'pineapple' : 'mango', alive: 1 });
      checkRoomUnlock();
    } else {
      e.stunT = 1.2; sfxClack();
    }
  }
  function hitBoss(b, dmg) {
    if (b.invT > 0) return;
    b.hp = M.max(0, b.hp - dmg); b.hurtT = 0.22; b.invT = 0.45;
    _shakeT = 0.2; _shakeMag = 3; sfxBoom();
    burstParts(b.x + 14, b.y + 14, '#fde047', 12);
    spawnPop(b.x + 14, b.y, '-' + dmg, 5);
    if (b.hp <= b.maxHp * 0.5 && b.ph < 2) { b.ph = 2; WLD.msg = 'PHASE 2! WATCH OUT!'; WLD.msgT = 1.5; }
    if (b.id === 4 && b.hp <= 3 && b.ph < 3) { b.ph = 3; WLD.msg = 'FINAL PHASE: BARNABY RAGE!'; WLD.msgT = 1.6; }
    if (b.hp <= 0 && (!b.sub || !b.sub.alive)) bossDefeated();
  }
  function hitBossSub(s, dmg) {
    s.hp = M.max(0, s.hp - dmg); s.hurtT = 0.22; sfxBoom();
    burstParts(s.x + 14, s.y + 14, '#38bdf8', 10);
    if (s.hp <= 0) { s.alive = 0; WLD.score += 800; if (WLD.boss.hp <= 0) bossDefeated(); }
  }
  function bossDefeated() {
    WLD.boss.alive = 0; WLD.score += 2000 + WLD.hp * 150 + WLD.pineGot * 1000;
    WLD.winT = 2.4; sfxWin(); _shakeT = 0.4; _shakeMag = 4;
    WLD.msg = WLD.stId === 4 ? 'CHEF MAMBO RESCUED!!' : 'ISLAND CLEARED!!'; WLD.msgT = 2.4;
    const i = WLD.stId;
    if (WLD.pineGot) SAV.pineapples[i] = 1;
    if (WLD.score > SAV.bestScore[i]) SAV.bestScore[i] = WLD.score;
    if (!SAV.bestTime[i] || WLD.time < SAV.bestTime[i]) SAV.bestTime[i] = WLD.time;
    const rnk = WLD.hp >= 6 && WLD.pineGot ? 'S' : WLD.hp >= 4 ? 'A' : WLD.lives >= 2 ? 'B' : 'C';
    const ord = { '':0, D:1, C:2, B:3, A:4, S:5 };
    if (ord[rnk] > ord[SAV.ranks[i] || '']) SAV.ranks[i] = rnk;
    if (i + 1 >= SAV.unlocked && i < 4) SAV.unlocked = i + 2;
    SAV.highScore = M.max(SAV.highScore, SAV.bestScore.reduce((a, b) => a + b, 0));
    persist();
  }

  /* --- CONTEXTUAL ACTION (B BUTTON) --- */
  function doAction(L, P) {
    const H = HEROES[L.hid], [dc, dr] = DIRS[L.dir];
    if (L.carry) {
      const spd = L.carry === 'bomb' ? 148 : 175;
      spawnProj(L.x + 6 + dc * 6, L.y + 6 + dr * 6, dc * spd, dr * spd, L.carry, 0, H.throwDmg, 1);
      L.carry = null; L.sqT = 0.34; sfxThrow(); return;
    }
    if (WLD.cart && !WLD.cart.riding && M.hypot(WLD.cart.x - L.x, WLD.cart.y - L.y) < 18) {
      WLD.cart.riding = 1; WLD.cart.dir = WLD.cart.x <= WLD.cart.x0 + 8 ? 1 : -1;
      sfxKick(); return;
    }
    const fc = ((L.x + 6 + dc * 12) / TILE) | 0, fr_ = ((L.y + 6 + dr * 12) / TILE) | 0;
    const blk = blockAt(fc, fr_, null);
    if (blk) { kickBlock(blk, L.dir); return; }

    for (const pr of WLD.props) {
      if (pr.alive && M.hypot(pr.x + 6 - (L.x + 6 + dc * 8), pr.y + 6 - (L.y + 6 + dr * 8)) < 15) {
        pr.alive = 0; L.carry = pr.k; L.sqT = 0.34; sfxGrab(); return;
      }
    }
    const rm = WLD.rooms[WLD.rmIdx], rs = WLD.rStates[WLD.rmIdx];
    if (rm.lock && !rs.unlocked && (rm.lock.type === 'key_b' || rm.lock.type === 'key_s')) {
      if (isDoorBlocked(rm, rs, fc, fr_)) {
        if (L.tool === rm.lock.type) {
          L.tool = 'none'; rs.unlocked = true; sfxDoor();
          WLD.msg = 'DOOR UNLOCKED!'; WLD.msgT = 1.4; return;
        } else if (P.tool === rm.lock.type && M.hypot(L.x - P.x, L.y - P.y) < 36) {
          P.tool = 'none'; rs.unlocked = true; sfxDoor();
          WLD.msg = 'PARTNER UNLOCKED DOOR!'; WLD.msgT = 1.4; return;
        } else {
          sfxClack(); WLD.msg = 'NEED ' + TOOLS[rm.lock.type].name; WLD.msgT = 1.2; return;
        }
      }
    }
  }

  /* --- EQUIPPED TOOL USE (Y BUTTON) --- */
  function useTool(L) {
    const t = L.tool, H = HEROES[L.hid], [dc, dr] = DIRS[L.dir];
    const rm = WLD.rooms[WLD.rmIdx], rs = WLD.rStates[WLD.rmIdx];
    if (t === 'none') { sfxClack(); return; }
    L.sqT = 0.34;
    if (t === 'grapple' && !L.hook) {
      L.hook = { x: L.x + 6, y: L.y + 6, dx: dc, dy: dr, len: 0, maxLen: 92, back: 0, grabItem: null };
      sfxHook();
    } else if (t === 'shovel') {
      const tc = ((L.x + 6 + dc * 12) / TILE) | 0, tr = ((L.y + 6 + dr * 12) / TILE) | 0;
      sfxDig(); burstParts(tc * TILE + 8, tr * TILE + 8, '#eab308', 6);
      if (tr >= 0 && tr < ROWS && tc >= 0 && tc < COLS && rm.grid[tr][tc] === 'D' && !rs.dug[tc + ',' + tr]) {
        rs.dug[tc + ',' + tr] = 1;
        const loot = rm.digLoot[tc + ',' + tr] || 'pineapple';
        WLD.items.push({ idx: -1, x: tc * TILE + 1, y: tr * TILE + 1, k: loot, alive: 1 });
        spawnPop(tc * TILE + 8, tr * TILE, 'DUG UP!', 1); sfxSolve();
      }
      for (const e of WLD.enemies) if (e.alive && M.hypot(e.x + 8 - (L.x + 6 + dc * 12), e.y + 8 - (L.y + 6 + dr * 12)) < 16) hitEnemy(e, 1);
    } else if (t === 'plank') {
      const tc = ((L.x + 6 + dc * 14) / TILE) | 0, tr = ((L.y + 6 + dr * 14) / TILE) | 0;
      if (tr >= 0 && tr < ROWS && tc >= 0 && tc < COLS && rm.grid[tr][tc] === '~') {
        rs.planks.push({ c: tc, r: tr });
        const tc2 = tc + dc, tr2 = tr + dr;
        if (tr2 >= 0 && tr2 < ROWS && tc2 >= 0 && tc2 < COLS && rm.grid[tr2][tc2] === '~') rs.planks.push({ c: tc2, r: tr2 });
        L.tool = 'none'; sfxKick();
        WLD.msg = 'BRIDGE PLACED!'; WLD.msgT = 1.1;
      } else sfxClack();
    } else if (t === 'bell') {
      L.bellT = 0.55; sfxBell();
      for (const e of WLD.enemies) if (e.alive && e.t !== 'cannon') { e.awake = 1; e.lureX = L.x; e.lureY = L.y; e.lureT = 3.2; }
    } else if (t === 'lantern') {
      let litAny = 0;
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
        if (rm.grid[r][c] === 'B' && !rs.litBraz[c + ',' + r] && M.hypot(c * TILE + 8 - L.x - 6, r * TILE + 8 - L.y - 6) < 28) {
          rs.litBraz[c + ',' + r] = 1; litAny = 1; WLD.score += 100;
          burstParts(c * TILE + 8, r * TILE + 8, '#fb923c', 8);
        }
      }
      if (litAny) { sfxSolve(); WLD.msg = 'BRAZIER LIT!'; WLD.msgT = 1.1; }
      else { burstParts(L.x + 6, L.y + 6, '#fde047', 4); sfxGrab(); }
    } else if (t === 'key_b' || t === 'key_s') {
      const fc = ((L.x + 6 + dc * 14) / TILE) | 0, fr_ = ((L.y + 6 + dr * 14) / TILE) | 0;
      if (rm.lock && !rs.unlocked && rm.lock.type === t && isDoorBlocked(rm, rs, fc, fr_)) {
        L.tool = 'none'; rs.unlocked = true; sfxDoor(); WLD.msg = 'DOOR UNLOCKED!'; WLD.msgT = 1.4;
      } else sfxClack();
    }
  }

  /* --- MAIN GAMEPLAY STEP (60 HZ FIXED TIMESTEP) --- */
  function stepPlay() {
    if (hit('t')) { pauseI = 0; state = 'pause'; return; }
    if (hit('undo')) undoKick();
    if (_panT > 0) { _panT--; return; }
    if (_shakeT > 0) _shakeT = M.max(0, _shakeT - DT);
    if (WLD.msgT > 0) WLD.msgT = M.max(0, WLD.msgT - DT);
    if (WLD.winT > 0) { WLD.winT -= DT; if (WLD.winT <= 0) state = 'clear'; return; }
    if (WLD.overT > 0) { WLD.overT -= DT; if (WLD.overT <= 0) { menuI = 0; state = 'over'; } return; }
    WLD.time += DT;

    const rm = WLD.rooms[WLD.rmIdx], rs = WLD.rStates[WLD.rmIdx];
    const L = WLD.duo[WLD.leadIdx], P = WLD.duo[WLD.leadIdx ^ 1], H = HEROES[L.hid];

    if (IK.e) {
      _selHold += DT;
      if (_selHold >= 0.6) { _selHold = -99; resetRoomBlocks(); }
    } else {
      if (_selHold > 0 && _selHold < 0.6) {
        if (M.hypot(L.x - P.x, L.y - P.y) < 34) {
          const tmp = L.tool; L.tool = P.tool; P.tool = tmp; sfxTag();
          WLD.msg = 'TOOLS SWAPPED!'; WLD.msgT = 0.9;
        } else {
          _showMap ^= 1; clk();
        }
      }
      _selHold = 0;
    }

    if (hit('x') && (!WLD.cart || !WLD.cart.riding)) {
      WLD.leadIdx ^= 1; sfxTag();
      const NL = WLD.duo[WLD.leadIdx];
      NL.sqT = 0.34;
      burstParts(NL.x + 6, NL.y + 6, '#38bdf8', 6);
      WLD.msg = 'TAG: ' + HEROES[NL.hid].name + '!'; WLD.msgT = 0.9;
      return;
    }

    if (hit('a')) {
      if (L.carry) {
        const ang = M.atan2(P.y - L.y, P.x - L.x);
        spawnProj(L.x + 6, L.y + 6, M.cos(ang) * 165, M.sin(ang) * 165, L.carry, 0, H.throwDmg, 1);
        L.carry = null; sfxThrow();
      } else {
        WLD.partnerHold ^= 1; P.sqT = 0.34; sfxTag();
        WLD.msg = HEROES[P.hid].name + (WLD.partnerHold ? ': HOLD & CATCH!' : ': FOLLOW!');
        WLD.msgT = 1.0;
      }
    }

    if (hit('b')) doAction(L, P);
    if (hit('s')) useTool(L);
    L.handsUp = !!(L.carry || IK.b);
    if (L.invT > 0) L.invT = M.max(0, L.invT - DT);
    if (L.hurtT > 0) L.hurtT = M.max(0, L.hurtT - DT);
    if (L.bellT > 0) L.bellT = M.max(0, L.bellT - DT);
    if (L.sqT > 0) L.sqT = M.max(0, L.sqT - DT);
    if (P.sqT > 0) P.sqT = M.max(0, P.sqT - DT);

    if (WLD.cart && WLD.cart.riding) {
      WLD.cart.x += WLD.cart.dir * 135 * DT;
      L.x = WLD.cart.x + 2; L.y = WLD.cart.y + 1;
      P.x = L.x - WLD.cart.dir * 8; P.y = L.y;
      if (WLD.cart.x >= WLD.cart.x1) { WLD.cart.x = WLD.cart.x1; WLD.cart.riding = 0; L.x = WLD.cart.x1 + 14; }
      else if (WLD.cart.x <= WLD.cart.x0) { WLD.cart.x = WLD.cart.x0; WLD.cart.riding = 0; L.x = WLD.cart.x0 - 14; }
    } else if (!L.hook) {
      let dx = (IK.r ? 1 : 0) - (IK.l ? 1 : 0), dy = (IK.d ? 1 : 0) - (IK.u ? 1 : 0);
      if (dx && dy) { dx *= 0.707; dy *= 0.707; }
      if (M.abs(dx) > M.abs(dy)) L.dir = dx < 0 ? 2 : 3;
      else if (dy !== 0) L.dir = dy < 0 ? 1 : 0;
      const spd = L.carry ? H.carrySpd : H.spd;
      const isPip = L.hid === 1;
      if (dx !== 0) {
        const nx = L.x + dx * spd * DT;
        if (!rectBlocked(nx, L.y, L.w, L.h, isPip)) L.x = nx;
        else {
          for (let n = 1; n <= 6; n++) {
            if (!rectBlocked(nx, L.y - n, L.w, L.h, isPip)) { L.y -= 1.2; break; }
            if (!rectBlocked(nx, L.y + n, L.w, L.h, isPip)) { L.y += 1.2; break; }
          }
        }
      }
      if (dy !== 0) {
        const ny = L.y + dy * spd * DT;
        if (!rectBlocked(L.x, ny, L.w, L.h, isPip)) L.y = ny;
        else {
          for (let n = 1; n <= 6; n++) {
            if (!rectBlocked(L.x - n, ny, L.w, L.h, isPip)) { L.x -= 1.2; break; }
            if (!rectBlocked(L.x + n, ny, L.w, L.h, isPip)) { L.x += 1.2; break; }
          }
        }
      }
      if (dx || dy) {
        L.anim += DT * 9;
        WLD.trail.push([L.x, L.y, L.dir]);
        if (WLD.trail.length > 26) WLD.trail.shift();
      }
      const lc = ((L.x + 6) / TILE) | 0, lr = ((L.y + 6) / TILE) | 0;
      if (lr >= 0 && lr < ROWS && lc >= 0 && lc < COLS && rm.grid[lr][lc] === 'K' && !isPip) hurtPlayer(2);
    }

    if (!WLD.partnerHold && WLD.trail.length > 14 && (!WLD.cart || !WLD.cart.riding)) {
      const tgt = WLD.trail[0];
      const ddx = tgt[0] - P.x, ddy = tgt[1] - P.y, dist = M.hypot(ddx, ddy);
      if (dist > 3) {
        P.x += (ddx / dist) * M.min(dist, 92 * DT);
        P.y += (ddy / dist) * M.min(dist, 92 * DT);
        P.dir = tgt[2]; P.anim += DT * 8;
      }
    }
    P.handsUp = !!(P.carry || WLD.partnerHold);

    let plateHit = 0;
    if (WLD.gateLatchT > 0) { WLD.gateLatchT -= DT; plateHit = 1; }
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (rm.grid[r][c] === 'Q') {
        const px = c * TILE + 8, py = r * TILE + 8;
        if (M.hypot(L.x + 6 - px, L.y + 6 - py) < 13 || M.hypot(P.x + 6 - px, P.y + 6 - py) < 13 || blockAt(c, r, null)) plateHit = 1;
        for (const e of WLD.enemies) if (e.alive && M.hypot(e.x + 8 - px, e.y + 8 - py) < 16) { plateHit = 1; WLD.gateLatchT = 2.5; }
      }
    }
    if (WLD.partnerHold && rm.grid.some(row => row.includes('Q'))) {
      if (M.hypot(P.x - L.x, P.y - L.y) > 10 || plateHit) plateHit = 1;
    }
    if (plateHit !== WLD.gateOpen) { WLD.gateOpen = plateHit; sfxClack(); }

    if (L.x < 4 && rm.doors.W != null) { enterRoom(rm.doors.W, (COLS - 2) * TILE, 6 * TILE + 2, -1, 0); return; }
    if (L.x > IW - 16 && rm.doors.E != null) { enterRoom(rm.doors.E, TILE + 2, 6 * TILE + 2, 1, 0); return; }
    if (L.y < 4 && rm.doors.N != null) { enterRoom(rm.doors.N, 9 * TILE + 8, (ROWS - 2) * TILE, 0, -1); return; }
    if (L.y > PLAY_H - 16 && rm.doors.S != null) { enterRoom(rm.doors.S, 9 * TILE + 8, TILE + 2, 0, 1); return; }

    if (L.hook) {
      const hk = L.hook, hSpd = 210 * H.grapMul;
      if (!hk.back) {
        hk.len += hSpd * DT;
        hk.x = L.x + 6 + hk.dx * hk.len; hk.y = L.y + 6 + hk.dy * hk.len;
        const hc = (hk.x / TILE) | 0, hr = (hk.y / TILE) | 0;
        if (hk.len >= hk.maxLen || hc <= 0 || hc >= COLS - 1 || hr <= 0 || hr >= ROWS - 1) hk.back = 1;
        else if (rm.grid[hr][hc] === 'H') {
          const pc = ((L.x + 6) / TILE) | 0, pr_ = ((L.y + 6) / TILE) | 0;
          rs.bridges.push({ c0: pc, r0: pr_, c1: hc, r1: hr });
          sfxSolve(); WLD.msg = 'ROPE BRIDGE BUILT!'; WLD.msgT = 1.2;
          hk.back = 1;
        } else if (rm.grid[hr][hc] === '#' || rm.grid[hr][hc] === 'P') {
          sfxClack(); hk.back = 1;
        }
        for (const e of WLD.enemies) {
          if (e.alive && M.hypot(e.x + 8 - hk.x, e.y + 8 - hk.y) < 12) {
            if (e.t === 'crab' || e.t === 'bat' || e.t === 'parrot') hitEnemy(e, 2);
            else { e.stunT = 2.6; sfxClack(); spawnPop(e.x + 8, e.y, 'STUN!', 2); }
            hk.back = 1; break;
          }
        }
        for (const it of WLD.items) {
          if (it.alive && M.hypot(it.x + 6 - hk.x, it.y + 6 - hk.y) < 12) { hk.grabItem = it; hk.back = 1; break; }
        }
      } else {
        hk.len -= hSpd * 1.25 * DT;
        hk.x = L.x + 6 + hk.dx * M.max(0, hk.len); hk.y = L.y + 6 + hk.dy * M.max(0, hk.len);
        if (hk.grabItem && hk.grabItem.alive) { hk.grabItem.x = hk.x - 6; hk.grabItem.y = hk.y - 6; }
        if (hk.len <= 0) L.hook = null;
      }
    }

    for (const it of WLD.items) {
      if (!it.alive) continue;
      if (M.hypot(it.x + 6 - (L.x + 6), it.y + 6 - (L.y + 6)) < 13) {
        const k = it.k;
        if (k === 'pineapple') { it.alive = 0; healPlayer(2, it.x + 6, it.y); sfxPick(); }
        else if (k === 'mango') { it.alive = 0; healPlayer(4, it.x + 6, it.y); sfxPick(); }
        else if (k === 'pearl_r') { it.alive = 0; WLD.lives = M.min(9, WLD.lives + 1); spawnPop(it.x + 6, it.y, '1-UP PEARL!', 5); sfxDoor(); }
        else if (k === 'pearl_b') { it.alive = 0; WLD.score += 1000; spawnPop(it.x + 6, it.y, '+1000 PEARL', 2); sfxDoor(); }
        else if (k === 'goldpine') { it.alive = 0; WLD.pineGot = 1; WLD.score += 1000; spawnPop(it.x + 6, it.y, 'GOLDEN PINE!', 1); sfxDoor(); }
        else if (TOOLS[k]) {
          const old = L.tool; L.tool = k;
          if (old !== 'none') {
            if (P.tool === 'none') { P.tool = old; it.alive = 0; if (it.idx >= 0) rs.collected[it.idx] = 1; }
            else { it.k = old; it.x = L.x + 14 * (L.dir === 2 ? 1 : -1); }
          } else { it.alive = 0; if (it.idx >= 0) rs.collected[it.idx] = 1; }
          sfxPick(); WLD.msg = 'GOT ' + TOOLS[k].name + '!'; WLD.msgT = 1.2;
        }
      }
    }

    for (const b of rs.blocks) {
      if (!b.sliding) continue;
      const nx = b.x + b.vx * DT, ny = b.y + b.vy * DT;
      const dc = M.sign(b.vx), dr = M.sign(b.vy);
      const nextC = dc > 0 ? M.floor((nx + TILE - 1) / TILE) : dc < 0 ? M.floor(nx / TILE) : b.c;
      const nextR = dr > 0 ? M.floor((ny + TILE - 1) / TILE) : dr < 0 ? M.floor(ny / TILE) : b.r;
      if ((nextC !== b.c || nextR !== b.r) && (tileSolid(nextC, nextR, 1, 0) || blockAt(nextC, nextR, b))) {
        b.x = b.c * TILE; b.y = b.r * TILE; b.vx = 0; b.vy = 0; b.sliding = 0;
        sfxClack(); checkRoomUnlock();
      } else {
        b.x = nx; b.y = ny;
        const cc = M.round(b.x / TILE), cr = M.round(b.y / TILE);
        if (M.abs(b.x - cc * TILE) < 3 && M.abs(b.y - cr * TILE) < 3) {
          b.c = cc; b.r = cr;
          const ch = rm.grid[cr][cc];
          if (ch === '>' && b.vx <= 0) { b.x = cc * TILE; b.y = cr * TILE; b.vx = 168; b.vy = 0; sfxHook(); }
          else if (ch === '<' && b.vx >= 0) { b.x = cc * TILE; b.y = cr * TILE; b.vx = -168; b.vy = 0; sfxHook(); }
          else if (ch === '^' && b.vy >= 0) { b.x = cc * TILE; b.y = cr * TILE; b.vx = 0; b.vy = -168; sfxHook(); }
          else if (ch === 'v' && b.vy <= 0) { b.x = cc * TILE; b.y = cr * TILE; b.vx = 0; b.vy = 168; sfxHook(); }
        }
        for (const e of WLD.enemies) if (e.alive && M.hypot(e.x - b.x, e.y - b.y) < 14) hitEnemy(e, 3);
      }
    }

    for (let i = 0; i < P_PROJ.n; i++) {
      const pr = P_PROJ.a[i]; if (!pr.alive) continue;
      pr.t += DT;
      pr.x += pr.vx * DT; pr.y += pr.vy * DT;
      pr.z += pr.vz * DT; pr.vz -= 165 * DT;
      if (pr.z < 0) { pr.z = 0; pr.vz = -pr.vz * 0.45; }
      const pc = (pr.x / TILE) | 0, pr_ = (pr.y / TILE) | 0;
      if (pr.t >= pr.maxT || (pc <= 0 || pc >= COLS - 1 || pr_ <= 0 || pr_ >= ROWS - 1 || projSolid(pc, pr_))) {
        if (pr.bounces > 0 && pr.t < pr.maxT) {
          pr.bounces--;
          if (pc <= 0 || pc >= COLS - 1 || projSolid(pc, (pr.y / TILE) | 0)) pr.vx = -pr.vx;
          else pr.vy = -pr.vy;
          sfxClack(); continue;
        }
        pr.alive = 0;
        if (pr.kind === 'bomb') bombExplode(pr.x, pr.y);
        else { sfxSmash(); burstParts(pr.x, pr.y, '#d97706', 6); }
        continue;
      }
      if (pr.fromEn) {
        if (M.hypot(pr.x - (L.x + 6), pr.y - (L.y + 6)) < H.catchR) {
          if (L.handsUp && !L.carry && pr.catchable) {
            pr.alive = 0; L.carry = pr.kind === 'skull' || pr.kind === 'bomb' ? pr.kind : 'barrel';
            L.sqT = 0.34; sfxCatch(); spawnPop(L.x + 6, L.y - 4, 'CAUGHT!', 2); continue;
          } else if (L.hid === 2 && L.handsUp && !pr.catchable) {
            pr.fromEn = 0; pr.vx = -pr.vx * 1.1; pr.vy = -pr.vy * 1.1; pr.dmg = 2;
            L.sqT = 0.34; sfxClack(); spawnPop(L.x + 6, L.y - 4, 'BRACE!', 3); continue;
          } else {
            pr.alive = 0;
            if (pr.kind === 'bomb') bombExplode(pr.x, pr.y);
            hurtPlayer(2); continue;
          }
        }
      } else {
        if (WLD.partnerHold && !P.carry && pr.t > 0.12 && pr.catchable && M.hypot(pr.x - (P.x + 6), pr.y - (P.y + 6)) < HEROES[P.hid].catchR) {
          pr.alive = 0; P.carry = pr.kind; P.sqT = 0.34; sfxCatch();
          spawnPop(P.x + 6, P.y - 4, 'CAUGHT!', 2); continue;
        }
        for (const e of WLD.enemies) {
          if (e.alive && M.hypot(pr.x - (e.x + 8), pr.y - (e.y + 8)) < 13) {
            pr.alive = 0;
            if (pr.kind === 'bomb') bombExplode(pr.x, pr.y);
            else hitEnemy(e, pr.dmg);
            break;
          }
        }
        if (pr.alive && WLD.boss && WLD.boss.alive) {
          const b = WLD.boss;
          if (M.hypot(pr.x - (b.x + 14), pr.y - (b.y + 14)) < 18) {
            pr.alive = 0;
            if (pr.kind === 'bomb') bombExplode(pr.x, pr.y);
            else hitBoss(b, pr.dmg);
          } else if (b.sub && b.sub.alive && M.hypot(pr.x - (b.sub.x + 14), pr.y - (b.sub.y + 14)) < 18) {
            pr.alive = 0;
            if (pr.kind === 'bomb') bombExplode(pr.x, pr.y);
            else hitBossSub(b.sub, pr.dmg);
          }
        }
      }
    }
    P_PROJ.compact(p => p.alive);

    for (const e of WLD.enemies) {
      if (!e.alive) continue;
      if (e.hurtT > 0) e.hurtT -= DT;
      if (e.stunT > 0) { e.stunT -= DT; continue; }
      e.anim += DT * 6;
      const dist = M.hypot(L.x - e.x, L.y - e.y);
      if (!e.awake) { if (dist < 64) { e.awake = 1; sfxClack(); } else continue; }
      if (e.t === 'cannon') {
        e.tmr -= DT;
        if (e.tmr <= 0) {
          e.tmr = 2.1;
          const a = M.atan2(L.y - e.y, L.x - e.x);
          spawnProj(e.x + 8, e.y + 8, M.cos(a) * 115, M.sin(a) * 115, 'barrel', 1, 1, 1);
          sfxKick();
        }
        continue;
      }
      const tx = e.lureT > 0 ? e.lureX : L.x, ty = e.lureT > 0 ? e.lureY : L.y;
      if (e.lureT > 0) e.lureT -= DT;
      const ang = M.atan2(ty - e.y, tx - e.x);
      const spd = e.t === 'bat' || e.t === 'parrot' ? 44 : e.t === 'bosun' ? 52 : 34;
      const nx = e.x + M.cos(ang) * spd * DT, ny = e.y + M.sin(ang) * spd * DT;
      const fly = e.t === 'bat' || e.t === 'parrot';
      if (fly || !rectBlocked(nx + 2, e.y + 2, 12, 12, 0)) e.x = M.max(TILE, M.min(IW - TILE * 2, nx));
      if (fly || !rectBlocked(e.x + 2, ny + 2, 12, 12, 0)) e.y = M.max(TILE, M.min(PLAY_H - TILE * 2, ny));
      if ((e.t === 'chucker' || e.t === 'elite') && (e.tmr -= DT) <= 0 && dist < 140) {
        e.tmr = 2.0;
        spawnProj(e.x + 8, e.y + 8, M.cos(ang) * 110, M.sin(ang) * 110, e.t === 'elite' ? 'bomb' : 'barrel', 1, 1, 1);
        sfxThrow();
      }
      if (dist < 12) hurtPlayer(2);
    }

    if (WLD.boss && WLD.boss.alive) {
      const b = WLD.boss;
      if (b.hurtT > 0) b.hurtT -= DT;
      if (b.invT > 0) b.invT -= DT;
      b.anim += DT * 6;
      b.tmr -= DT;
      if (b.id === 0) {
        const hatches = [[4*16,3*16],[14*16,3*16],[9*16,4*16],[5*16,7*16],[13*16,7*16]];
        if (b.tmr <= 0) {
          b.tmr = b.ph >= 2 ? 1.35 : 1.75;
          const h = hatches[(R() * hatches.length) | 0];
          b.x = h[0]; b.y = h[1];
          const a = M.atan2(L.y - b.y, L.x - b.x);
          const roll = R(), k = roll < 0.5 ? 'barrel' : roll < 0.78 ? 'bomb' : 'urchin';
          spawnProj(b.x + 14, b.y + 14, M.cos(a) * 112, M.sin(a) * 112, k, 1, 1, k !== 'urchin');
          sfxThrow();
        }
      } else if (b.id === 1) {
        b.x += b.vx * DT;
        if (b.x < 3 * TILE || b.x > 15 * TILE) b.vx = -b.vx;
        if (b.tmr <= 0) {
          b.tmr = b.ph >= 2 ? 1.2 : 1.55;
          const a = M.atan2(L.y - b.y, L.x - b.x);
          spawnProj(b.x + 14, b.y + 20, M.cos(a) * 120, M.sin(a) * 120, 'urchin', 1, 1, 0);
          const sx = R() < 0.5 ? 2 * TILE : 17 * TILE;
          const ba = M.atan2(L.y - 4 * TILE, L.x - sx);
          spawnProj(sx, 4 * TILE, M.cos(ba) * 105, M.sin(ba) * 105, 'barrel', 1, 1, 1);
          sfxThrow();
        }
      } else if (b.id === 2 || b.id === 3) {
        for (const u of [b, b.sub]) {
          if (!u || !u.alive) continue;
          if (u.hurtT > 0) u.hurtT -= DT;
          u.x += u.vx * DT; u.y += (u.vy || 0) * DT;
          if (u.x < 2 * TILE || u.x > 16 * TILE) u.vx = -u.vx;
          if (u.y < 2 * TILE || u.y > 7 * TILE) u.vy = -(u.vy || 28);
          if ((u.tmr -= DT) <= 0) {
            u.tmr = b.ph >= 2 ? 1.35 : 1.8;
            const a = M.atan2(L.y - u.y, L.x - u.x);
            const k = b.id === 2 ? (b.ph >= 2 && R() < 0.55 ? 'skull' : (R() < 0.5 ? 'barrel' : 'bone_b')) : (R() < 0.65 ? 'barrel' : 'urchin');
            spawnProj(u.x + 14, u.y + 14, M.cos(a) * 116, M.sin(a) * 116, k, 1, 1, k !== 'urchin' && k !== 'bone_b');
            sfxThrow();
          }
          if (M.hypot(L.x - u.x - 8, L.y - u.y - 8) < 16) hurtPlayer(2);
        }
      } else {
        b.x += b.vx * (b.ph >= 3 ? 1.4 : 1) * DT;
        if (b.x < 3 * TILE || b.x > 15 * TILE) b.vx = -b.vx;
        if (b.tmr <= 0) {
          b.tmr = b.ph >= 3 ? 1.1 : b.ph === 2 ? 1.35 : 1.6;
          const a = M.atan2(L.y - b.y, L.x - b.x);
          if (b.ph === 1) {
            spawnProj(b.x + 14, b.y + 16, M.cos(a) * 115, M.sin(a) * 115, 'barrel', 1, 1, 1);
            spawnProj(b.x + 14, b.y + 16, M.cos(a + 0.35) * 100, M.sin(a + 0.35) * 100, 'urchin', 1, 1, 0);
          } else if (b.ph === 2) {
            for (const o of [-0.28, 0, 0.28]) spawnProj(b.x + 14, b.y + 16, M.cos(a + o) * 118, M.sin(a + o) * 118, o === 0 ? 'bomb' : 'barrel', 1, 1, 1);
          } else {
            spawnProj(b.x + 14, b.y + 16, M.cos(a) * 128, M.sin(a) * 128, 'bomb', 1, 1, 1);
            spawnProj(b.x + 14, b.y + 16, M.cos(a - 0.35) * 120, M.sin(a - 0.35) * 120, 'urchin', 1, 1, 0);
            spawnProj(b.x + 14, b.y + 16, M.cos(a + 0.35) * 120, M.sin(a + 0.35) * 120, 'urchin', 1, 1, 0);
          }
          sfxThrow();
        }
      }
      if (M.hypot(L.x - b.x - 8, L.y - b.y - 8) < 17) hurtPlayer(2);
    }

    for (let i = 0; i < P_PART.n; i++) {
      const p = P_PART.a[i]; p.x += p.vx * DT; p.y += p.vy * DT; p.t -= DT;
      if (p.t <= 0) p.alive = 0;
    }
    P_PART.compact(p => p.alive);
    for (let i = 0; i < P_POP.n; i++) {
      const p = P_POP.a[i]; p.y -= 18 * DT; p.t -= DT;
      if (p.t <= 0) p.alive = 0;
    }
    P_POP.compact(p => p.alive);
  }

  /* --- MENU & GAME STATE ROUTER --- */
  function step() {
    readInput();
    const go = hit('t') || hit('b') || hit('a');
    if (state === 'title') {
      if (hit('u')) { menuI = (menuI + 3) % 4; clk(); }
      if (hit('d')) { menuI = (menuI + 1) % 4; clk(); }
      if (hit('e')) { exitToHub(); }
      else if (go) {
        clk();
        if (menuI === 0) { heroCursor = 0; state = 'duo'; }
        else if (menuI === 1) { state = 'howto'; }
        else if (menuI === 2) { optI = 0; state = 'opt'; }
        else exitToHub();
      }
    } else if (state === 'duo') {
      if (hit('l')) { if (heroCursor === 0) SAV.lead = (SAV.lead + 2) % 3; else SAV.partner = (SAV.partner + 2) % 3; if (SAV.lead === SAV.partner) SAV.partner = (SAV.lead + 1) % 3; clk(); }
      if (hit('r')) { if (heroCursor === 0) SAV.lead = (SAV.lead + 1) % 3; else SAV.partner = (SAV.partner + 1) % 3; if (SAV.lead === SAV.partner) SAV.partner = (SAV.lead + 1) % 3; clk(); }
      if (hit('u') || hit('d')) { heroCursor ^= 1; clk(); }
      if (hit('e')) { state = 'title'; clk(); }
      else if (go) { persist(); stSel = M.min(4, SAV.unlocked - 1); state = 'map'; clk(); }
    } else if (state === 'map') {
      if (hit('l') || hit('u')) { stSel = (stSel + 4) % 5; clk(); }
      if (hit('r') || hit('d')) { stSel = (stSel + 1) % 5; clk(); }
      if (hit('e')) { state = 'duo'; clk(); }
      else if (go) {
        if (stSel < SAV.unlocked) { clk(); startStage(stSel); }
        else sfxClack();
      }
    } else if (state === 'howto') {
      if (go || hit('e')) { state = 'title'; clk(); }
    } else if (state === 'opt') {
      if (hit('u')) { optI = (optI + 5) % 6; clk(); }
      if (hit('d')) { optI = (optI + 1) % 6; clk(); }
      const d = (hit('r') ? 1 : 0) - (hit('l') ? 1 : 0);
      if (d || go) {
        clk();
        if (optI === 0) SAV.set.mute ^= 1;
        else if (optI === 1) SAV.set.kickGhost ^= 1;
        else if (optI === 2) SAV.set.hiContrast ^= 1;
        else if (optI === 3) SAV.set.redMotion ^= 1;
        else if (optI === 4) { SAV.set.scanlines ^= 1; O.cr = SAV.set.scanlines; $('s').classList.toggle('mf-crt', !!O.cr); }
        else if (optI === 5 && !d) { SAV.unlocked = 5; persist(); sfxDoor(); }
        applyVol(); persist();
      }
      if (hit('e')) { state = 'title'; clk(); }
    } else if (state === 'play') {
      stepPlay();
    } else if (state === 'pause') {
      if (hit('u')) { pauseI = (pauseI + 4) % 5; clk(); }
      if (hit('d')) { pauseI = (pauseI + 1) % 5; clk(); }
      if (hit('e')) { state = 'play'; clk(); }
      else if (go) {
        clk();
        if (pauseI === 0) state = 'play';
        else if (pauseI === 1) { undoKick(); state = 'play'; }
        else if (pauseI === 2) { resetRoomBlocks(); state = 'play'; }
        else if (pauseI === 3) { state = 'map'; ms = -1; }
        else exitToHub();
      }
    } else if (state === 'clear') {
      if (go) {
        clk();
        if (WLD.stId < 4) { stSel = WLD.stId + 1; startStage(stSel); }
        else { state = 'map'; ms = -1; }
      }
      if (hit('e')) { state = 'map'; ms = -1; clk(); }
    } else if (state === 'over') {
      if (hit('l') || hit('r')) { menuI ^= 1; clk(); }
      if (go) { clk(); if (menuI === 0) startStage(WLD.stId); else { state = 'map'; ms = -1; } }
    }
    Object.assign(IQ, IK);
  }

  /* --- CACHED CARVED-DRIFTWOOD & BRASS HD HUD BAR --- */
  let _hudChromeC = null;
  function getHudChrome() {
    if (_hudChromeC) return _hudChromeC;
    const c = cnvGPU(IW * HD, HUD_H * HD), x = c._g;
    x.scale(HD, HD);
    x.imageSmoothingEnabled = true;
    const bg = x.createLinearGradient(0, 0, 0, HUD_H);
    bg.addColorStop(0, '#2a183b'); bg.addColorStop(1, '#140c22');
    x.fillStyle = bg; x.fillRect(0, 0, IW, HUD_H);
    x.fillStyle = '#f59e0b'; x.fillRect(0, HUD_H - 2, IW, 1.4);
    x.fillStyle = '#fef08a'; x.fillRect(0, HUD_H - 2, IW, 0.5);
    /* Brass-trimmed Portrait & Tool Tray */
    x.fillStyle = '#1e293b'; x.beginPath(); x.roundRect(4, 3, 98, 25, 4); x.fill();
    x.strokeStyle = '#fde047'; x.lineWidth = 1.2; x.stroke();
    return _hudChromeC = c;
  }

  function drawHud() {
    g.drawImage(getHudChrome(), 0, 0, IW, HUD_H);
    const L = WLD.duo[WLD.leadIdx], P = WLD.duo[WLD.leadIdx ^ 1];

    /* HD Lead & Partner Portraits + Brass Tool Badges */
    const spL = getHeroSp(L.hid, 0, 0, 0);
    g.drawImage(spL, 6, 3.5, 20, 23);
    bTxt(HEROES[L.hid].name, 28, 5, 1, 0, 1);
    bTxt('Y:' + TOOLS[L.tool].code, 28, 16, 2, 0, 1);

    const spP = getHeroSp(P.hid, 0, 0, WLD.partnerHold);
    g.drawImage(spP, 81, 4.5, 18, 21);
    bTxt(WLD.partnerHold ? 'H' : 'F', 72, 16, WLD.partnerHold ? 4 : 3, 0, 1);

    /* Glossy 3D Tropical Heart-Coconuts (6 Pips) + Lives */
    for (let i = 0; i < 3; i++) {
      const pips = M.max(0, M.min(2, WLD.hp - i * 2)), hx = 109 + i * 16;
      g.fillStyle = '#241201'; g.beginPath(); xRound(hx, 5.5, 13, 11.5, 3); g.fill();
      g.fillStyle = pips >= 1 ? '#f43f5e' : '#334155'; g.fillRect(hx + 1.2, 6.8, 4.8, 8.8);
      g.fillStyle = pips >= 2 ? '#f43f5e' : '#334155'; g.fillRect(hx + 7.0, 6.8, 4.8, 8.8);
      if (pips >= 1) { g.fillStyle = '#fda4af'; g.fillRect(hx + 2.0, 7.6, 2.0, 2.0); }
    }
    bTxt('x' + WLD.lives + '  ST' + (WLD.stId + 1) + '-' + (WLD.rmIdx + 1), 109, 19, 0, 0, 1);

    /* Score + Controls Cue */
    bTxt(String(WLD.score).padStart(6, '0'), 314, 5, 1, 2, 1);
    bTxt('X:TAG A:' + (WLD.partnerHold ? 'FOL' : 'HLD') + ' B:ACT', 314, 18, 6, 2, 1);
  }
  function xRound(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }

  /* --- SIX-LAYER HD 2X CARTOON WORLD RENDERER --- */
  function drawWorld() {
    const rm = WLD.rooms[WLD.rmIdx], rs = WLD.rStates[WLD.rmIdx], st = WLD.st;
    const shX = _shakeT > 0 && !SAV.set.redMotion ? (((R() - 0.5) * _shakeMag * 2) * 2 | 0) * 0.5 : 0;
    const shY = _shakeT > 0 && !SAV.set.redMotion ? (((R() - 0.5) * _shakeMag * 2) * 2 | 0) * 0.5 : 0;

    g.save();
    g.translate(shX, HUD_H + shY);

    /* Smooth 20-Frame Dual-Buffer Room Pan */
    if (_panT > 0) {
      const t = 1 - _panT / 20;
      g.drawImage(_panOldC, (-_panDx * IW * t), (-_panDy * PLAY_H * t), IW, PLAY_H);
      g.drawImage(_panNewC, (_panDx * IW * (1 - t)), (_panDy * PLAY_H * (1 - t)), IW, PLAY_H);
      g.restore(); return;
    }

    /* LAYER 0: Pre-Baked HD 2x Room Floor (1 single drawImage!) */
    g.drawImage(_roomBgC, 0, 0, IW, PLAY_H);

    /* LAYER 1: Animated Water Ripples, Dig Spots, Cracked Walls, Gates, Braziers */
    const wf = (fr >> 4) & 3;
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const px = c * TILE, py = r * TILE, ch = rm.grid[r][c];
        if (ch === '~') {
          g.fillStyle = st.pal.foam;
          g.beginPath(); g.roundRect(px + 2.5 + ((wf + r) & 3) * 1.6, py + 6.5 + (c & 1) * 3.5, 5.5, 1.2, 0.6); g.fill();
        } else if (ch === 'D' && !rs.dug[c + ',' + r]) {
          g.fillStyle = '#92400e'; g.beginPath(); xRound(px + 3.5, py + 3.5, 9, 9, 2.5); g.fill();
          g.strokeStyle = '#fde047'; g.lineWidth = 1.6;
          g.beginPath(); g.moveTo(px + 5.5, py + 5.5); g.lineTo(px + 10.5, py + 10.5); g.moveTo(px + 10.5, py + 5.5); g.lineTo(px + 5.5, py + 10.5); g.stroke();
        } else if (ch === 'C' && !rs.cracked[c + ',' + r]) {
          g.fillStyle = '#241201'; g.beginPath(); xRound(px + 0.5, py + 0.5, 15, 15, 2); g.fill();
          g.fillStyle = '#78716c'; g.beginPath(); xRound(px + 1.2, py + 1.2, 13.6, 13.6, 1.6); g.fill();
          g.strokeStyle = '#1c1917'; g.lineWidth = 1.5;
          g.beginPath(); g.moveTo(px + 6, py + 2.5); g.lineTo(px + 8.5, py + 7.5); g.lineTo(px + 6.5, py + 10.5); g.lineTo(px + 10, py + 13.5); g.stroke();
        } else if (ch === 'G') {
          if (!WLD.gateOpen) {
            g.fillStyle = '#241201'; g.beginPath(); xRound(px + 1, py + 1, 14, 14, 2.5); g.fill();
            g.fillStyle = '#0284c7'; g.beginPath(); xRound(px + 1.8, py + 1.8, 12.4, 12.4, 2.0); g.fill();
            g.fillStyle = '#7dd3fc'; g.fillRect(px + 4, py + 3, 2, 10); g.fillRect(px + 10, py + 3, 2, 10);
          } else {
            g.fillStyle = 'rgba(56,189,248,0.28)'; g.beginPath(); xRound(px + 2, py + 2, 12, 12, 2); g.fill();
          }
        } else if (ch === 'B') {
          g.fillStyle = '#241201'; g.beginPath(); xRound(px + 3, py + 5.5, 10, 8.5, 2); g.fill();
          g.fillStyle = '#475569'; g.beginPath(); xRound(px + 3.8, py + 6.2, 8.4, 7.0, 1.5); g.fill();
          if (rs.litBraz[c + ',' + r]) {
            const fl = ((fr >> 2) & 1) * 0.8;
            g.fillStyle = '#f97316'; g.beginPath(); g.ellipse(px + 8, py + 4.5 + fl, 4.2, 3.8, 0, 0, 7); g.fill();
            g.fillStyle = '#fef08a'; g.beginPath(); g.ellipse(px + 8, py + 4.8 + fl, 2.2, 2.2, 0, 0, 7); g.fill();
          }
        }
      }
    }

    /* Locked Door Barricade */
    if (rm.lock && !rs.unlocked) {
      const col = rm.lock.type === 'key_b' ? '#facc15' : rm.lock.type === 'key_s' ? '#e2e8f0' : '#f43f5e';
      const d = rm.lock.dir;
      g.fillStyle = '#241201';
      if (d === 'N') { g.fillRect(9 * 16, 0, 32, 14); g.fillStyle = col; g.fillRect(9 * 16 + 2, 2, 28, 10); }
      if (d === 'S') { g.fillRect(9 * 16, 12 * 16 + 2, 32, 14); g.fillStyle = col; g.fillRect(9 * 16 + 2, 12 * 16 + 4, 28, 10); }
      if (d === 'E') { g.fillRect(19 * 16 + 2, 6 * 16, 14, 16); g.fillStyle = col; g.fillRect(19 * 16 + 4, 6 * 16 + 2, 10, 12); }
      if (d === 'W') { g.fillRect(0, 6 * 16, 14, 16); g.fillStyle = col; g.fillRect(2, 6 * 16 + 2, 10, 12); }
    }

    /* Rope Bridges & Placed Planks */
    for (const br of rs.bridges) {
      g.fillStyle = '#f59e0b';
      if (br.r0 === br.r1) {
        const x0 = M.min(br.c0, br.c1) * TILE + 8, x1 = M.max(br.c0, br.c1) * TILE + 8, y = br.r0 * TILE + 4;
        g.fillRect(x0, y, x1 - x0, 8); g.fillStyle = '#fde047'; g.fillRect(x0, y + 2, x1 - x0, 4);
      } else {
        const y0 = M.min(br.r0, br.r1) * TILE + 8, y1 = M.max(br.r0, br.r1) * TILE + 8, x = br.c0 * TILE + 4;
        g.fillRect(x, y0, 8, y1 - y0); g.fillStyle = '#fde047'; g.fillRect(x + 2, y0, 4, y1 - y0);
      }
    }
    for (const pl of rs.planks) {
      g.fillStyle = '#78350f'; g.beginPath(); xRound(pl.c * TILE, pl.r * TILE + 2, TILE, 12, 2); g.fill();
      g.fillStyle = '#d97706'; g.beginPath(); xRound(pl.c * TILE + 1, pl.r * TILE + 3, TILE - 2, 10, 1.5); g.fill();
    }

    /* Minecart */
    if (WLD.cart) {
      const cx = WLD.cart.x, cy = WLD.cart.y;
      g.fillStyle = '#241201'; g.beginPath(); xRound(cx, cy, 16, 14, 3); g.fill();
      g.fillStyle = '#64748b'; g.beginPath(); xRound(cx + 1, cy + 1, 14, 10, 2); g.fill();
      g.fillStyle = '#fde047'; g.fillRect(cx + 2, cy + 2, 12, 3);
    }

    /* Kick Trajectory Aim Ghost */
    const L = WLD.duo[WLD.leadIdx];
    if (SAV.set.kickGhost) {
      const [dc, dr] = DIRS[L.dir];
      const fc = ((L.x + 6 + dc * 12) / TILE) | 0, fr_ = ((L.y + 6 + dr * 12) / TILE) | 0;
      const blk = blockAt(fc, fr_, null);
      if (blk) {
        g.fillStyle = 'rgba(253,224,71,0.88)';
        for (let s = 1; s <= 3; s++) {
          g.beginPath(); g.arc(blk.x + 8 + dc * s * 10, blk.y + 8 + dr * s * 10, 2.2, 0, 7); g.fill();
        }
      }
    }

    /* LAYER 2: Items, Props, Sliding Blocks (HD 2x Sprites Drawn at Logical Size) */
    const bob = M.sin(fr * 0.12) * 1.4;
    for (const it of WLD.items) {
      if (!it.alive) continue;
      g.fillStyle = 'rgba(24,14,4,0.32)'; g.beginPath(); g.ellipse(it.x + 7, it.y + 13, 5.2, 2.0, 0, 0, 7); g.fill();
      const sp = getPropSp(it.k);
      g.drawImage(sp, it.x - 1, it.y - 1 + bob, sp.lw, sp.lh);
    }
    for (const pr of WLD.props) {
      if (!pr.alive) continue;
      g.fillStyle = 'rgba(24,14,4,0.35)'; g.beginPath(); g.ellipse(pr.x + 7, pr.y + 13, 5.8, 2.2, 0, 0, 7); g.fill();
      const sp = getPropSp(pr.k);
      g.drawImage(sp, pr.x - 1, pr.y - 1, sp.lw, sp.lh);
    }
    const blkSp = getPropSp('block');
    for (const b of rs.blocks) {
      g.fillStyle = 'rgba(24,14,4,0.38)'; g.beginPath(); g.ellipse(b.x + 8, b.y + 14.5, 6.8, 2.4, 0, 0, 7); g.fill();
      g.drawImage(blkSp, b.x, b.y, blkSp.lw, blkSp.lh);
    }

    /* LAYER 3: Y-Sorted Enemies, Articulated Multi-Part Bosses & Squash-Stretch Misfits */
    for (const e of WLD.enemies) {
      if (!e.alive) continue;
      g.fillStyle = 'rgba(24,14,4,0.36)'; g.beginPath(); g.ellipse(e.x + 8, e.y + 14.5, 6.2, 2.3, 0, 0, 7); g.fill();
      const sp = getEnSp(e.t, e.anim | 0);
      g.drawImage(e.hurtT > 0 ? sp.hit : sp, e.x - 2, e.y - 5, sp.lw, sp.lh);
      if (e.stunT > 0) {
        for (let k = 0; k < 3; k++) {
          const a = fr * 0.2 + k * 2.09;
          g.fillStyle = '#fde047'; g.beginPath(); g.arc(e.x + 8 + M.cos(a) * 6.5, e.y - 6 + M.sin(a) * 2.2, 1.5, 0, 7); g.fill();
        }
      }
    }

    if (WLD.boss && WLD.boss.alive) {
      const b = WLD.boss;
      for (const u of [b, b.sub]) {
        if (!u || !u.alive) continue;
        g.fillStyle = 'rgba(24,14,4,0.44)'; g.beginPath(); g.ellipse(u.x + 14, u.y + 26, 13.5, 4.2, 0, 0, 7); g.fill();
        const sp = getBossSp(b.id, b.anim | 0, b.ph);
        g.drawImage(u.hurtT > 0 ? sp.hit : sp, u.x - 4, u.y - 8, sp.lw, sp.lh);
      }
      const maxTot = b.maxHp + (b.sub ? b.sub.maxHp : 0);
      const curTot = b.hp + (b.sub && b.sub.alive ? b.sub.hp : 0);
      bPanel(60, 4, 200, 10, '#fde047', '#1e1b4b');
      g.fillStyle = '#ef4444'; g.fillRect(62, 6, (196 * M.max(0, curTot / maxTot)) | 0, 6);
      bTxt(WLD.st.bossName, 160, 5.5, 0, 1, 1);
    }

    /* Draw Partner & Lead Misfits with Volume-Preserving Squash & Stretch Spring */
    const drawOrder = WLD.duo[0].y < WLD.duo[1].y ? [0, 1] : [1, 0];
    for (const di of drawOrder) {
      const m = WLD.duo[di], isLead = di === WLD.leadIdx;
      if (isLead && m.invT > 0 && (fr & 2)) continue;
      g.fillStyle = isLead ? 'rgba(253,224,71,0.42)' : 'rgba(56,189,248,0.34)';
      g.beginPath(); g.ellipse(m.x + 6, m.y + 12.2, 6.8, 2.6, 0, 0, 7); g.fill();

      const sp = getHeroSp(m.hid, m.dir, m.anim | 0, m.handsUp);
      const [sx, sy] = squashScale(m.sqT);
      const dw = sp.lw * sx, dh = sp.lh * sy;
      const dx = (m.x + 6) - dw * 0.5;
      const dy = (m.y + 13) - dh;
      g.drawImage(m.hurtT > 0 ? sp.hit : sp, dx, dy, dw, dh);

      if (m.carry) {
        const csp = getPropSp(m.carry);
        g.drawImage(csp, m.x - 2, dy - 12, csp.lw, csp.lh);
      }
      if (m.bellT > 0) {
        const rad = (0.55 - m.bellT) * 110;
        g.strokeStyle = '#fde047'; g.lineWidth = 1.6;
        g.beginPath(); g.arc(m.x + 6, m.y + 4, rad, 0, 7); g.stroke();
      }
      if (m.hook) {
        const hk = m.hook;
        g.strokeStyle = '#f59e0b'; g.lineWidth = 2.2;
        g.beginPath(); g.moveTo(m.x + 6, m.y + 4); g.lineTo(hk.x, hk.y); g.stroke();
        g.fillStyle = '#fef08a'; g.beginPath(); g.arc(hk.x, hk.y, 2.8, 0, 7); g.fill();
      }
    }

    /* LAYER 4: Airborne Projectiles with Grounded Shadows & Motion Arcs */
    for (let i = 0; i < P_PROJ.n; i++) {
      const pr = P_PROJ.a[i];
      g.fillStyle = 'rgba(24,14,4,0.38)'; g.beginPath(); g.ellipse(pr.x, pr.y + 4, 5.2, 2.0, 0, 0, 7); g.fill();
      const sp = getPropSp(pr.kind === 'bone_b' ? 'bone' : pr.kind);
      g.drawImage(sp, pr.x - 8, pr.y - 8 - pr.z, sp.lw, sp.lh);
    }

    for (let i = 0; i < P_PART.n; i++) {
      const p = P_PART.a[i];
      g.fillStyle = p.col; g.beginPath(); g.arc(p.x, p.y, p.sz * 0.6, 0, 7); g.fill();
    }
    for (let i = 0; i < P_POP.n; i++) {
      const p = P_POP.a[i]; bTxt(p.txt, p.x, p.y, p.ci, 1, 1);
    }

    /* LAYER 5: Half-Res Dynamic Lantern Lightmap (320x208 -> 320x208 logical / 640x416 HD) */
    if (rm.dark) {
      const lx = _lightC._g;
      lx.globalCompositeOperation = 'source-over';
      lx.fillStyle = 'rgba(8,12,32,0.90)'; lx.fillRect(0, 0, 320, 208);
      lx.globalCompositeOperation = 'destination-out';
      for (const m of WLD.duo) {
        const lr = (m.tool === 'lantern' ? HEROES[m.hid].lantR : 24);
        const stmp = getLightStamp(lr + ((fr >> 3) & 1) * 1.5);

function masterStep(){
  if(_calOpen)return;
  if(GM=='pw'&&_pbOn&&!_pbT)_pbT=setTimeout(lvPre,500);
  if(GM!='fg'){if(!_fgM||!(fr&127)){fgSndMute();_fgM=1}if(GM!='mf'&&GM!='im'&&SB&&AC&&SB.gain.value<1.24)try{SB.gain.cancelScheduledValues(AC.currentTime);SB.gain.setTargetAtTime(1.25,AC.currentTime,.05)}catch(e){}}else _fgM=0;
  if(GM=='pw'){step();return}
  if(GM=='mf'){fr++;MF.step();return}
  if(GM=='im'){fr++;IM.step();return}
  for(const k of'lrudabtes')K[k]=KB[k]||TC[k];fr++;
  const h=k=>K[k]&&!Q[k],go=h('t')||h('a')||h('b');
  if(GM=='hub'){
    if(h('l')||h('u')){hubI=(hubI+3)%4;hubCas=0;clk()}
    if(h('r')||h('d')){hubI=(hubI+1)%4;hubCas=0;clk()}
    if(go){clk();launchHubGame(hubI)}
    Object.assign(Q,K);return;
  }
  fgStep(h,go);Object.assign(Q,K);
}

function masterDraw(){
  if(GM=='mf'||GM=='im'){
    if(MFR!==GM){
      if(HK){HK=0}
      MFR=GM;LF='';(GM=='mf'?MF:IM).size();
      if(GM=='mf'){cv.classList.add('mf-px');g.imageSmoothingEnabled=false}
      else{cv.classList.remove('mf-px');g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high'}

    MFR=0;cv.classList.remove('mf-px');$('s').classList.remove('mf-crt');cv.style.imageRendering='';g.imageSmoothingEnabled=true;setRS(GRS);rs();
  }
  if(HK&&GM!='hub'){HK=0;resetFT()}

}

const STEP=1000/60;
function loop(t){
  requestAnimationFrame(loop);
  let dt=t-la;la=t;
  if(!(dt>0&&dt<250))dt=STEP;                       /* first frame / tab resume */
  const q=dt/STEP,rq=M.round(q);
  if(rq>=1&&M.abs(q-rq)<.09)dt=rq*STEP;             /* snap vsync jitter: no dropped / doubled steps */
  ac+=dt>50?50:dt;FTm+=((dt>34?34:dt)-FTm)*.05;
  if(O.gq==0&&GM!='hub'&&GM!='mf'&&GM!='im'){       /* auto quality with bidirectional hysteresis (recovers back to 2x!) */
    if(RS>1&&FTm>22){if(++FCn>180){FCn=0;_recCn=0;setRS(RS>1.5?1.5:1)}}else if(FCn>0)FCn--;
    if(RS<2&&FTm<14){if(++_recCn>180){_recCn=0;FCn=0;setRS(RS<1.5?1.5:2)}}else if(_recCn>0)_recCn--;
  }
  let st=0;
  while(ac>=STEP-1.6&&st<3){ac-=STEP;st++;masterStep()}
  if(ac>=STEP-1.6)ac=0;                             /* drop backlog instead of fast-forwarding */
  if(st||needDraw){needDraw=0;masterDraw()}         /* 90/120Hz screens: do not redraw identical frames */
}
